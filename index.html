<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars: Origin | 瑪爾斯群英傳: 起源 </title>
    <link rel="icon" type="image/png" href="./assets/images/MO_ICON2.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --right-panel-width: var(--right-panel-width);
        }
        body {
            background-color: black;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .formatted-text {
            white-space: pre-wrap;
            /*font-family: 'Consolas', 'Courier New', monospace*/
            font-family: 'Noto Sans Mono CJK';
            tab-size: 4;
        }
        #output-container {
            flex: 1;
            position: relative;
            margin-right: var(--right-panel-width);
            background-color: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #output-top {
            flex: 0 0 auto;
            max-height: 0;
            overflow-y: auto;
            padding: 12px;
            background-color: black;
            color: inherit;  /* 繼承父元素的顏色 */
            line-height: 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre;
            opacity: 0;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }
        #output {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background-color: black;
            line-height: 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre;
        }
        .split-view #output-top {
            max-height: 50%;
            opacity: 1;
            border-bottom: 1px solid #333;
        }
        #statusBar {
            background-color: #1a1a1a;
            padding: 1px 10px;
            border-bottom: 1px solid #333;
        }
        .status-icon {
            margin-right: 5px;
        }
        .status-effect {
            color: #666;
            transition: color 0.3s ease;
        }
        .status-effect.active {
            color: #00ff00;
        }
        .status-effect.poison.active {
            color: #00ff00;
        }
        .status-effect.burn.active {
            color: #ff4500;
        }
        .status-effect.bleed.active {
            color: #ff0000;
        }
        .status-hp { color: #ff0000; }
        .status-mana { color: #4169e1; }
        .status-move { color: #ffd700; }
        .status-level {
            color: #9370db;
        }
        .status-gold {
            color: #ffd700;
        }
        .status-combat-stat {
            color: #ff6347;
        }
        @media (max-width: 576px) {
            #statusBar {
                flex-wrap: nowrap !important;
                overflow-x: auto;
            }
            .status-hp, .status-mana, .status-move {
                min-width: 0;
                flex: 1 1 0;
            }
            .status-label { display: none !important; }
        }
        .fixed-width {
            font-family: monospace;
            display: inline-block;
        }
        .hp-width { width: 5ch; }
        .mana-width { width: 5ch; }
        .move-width { width: 5ch; }
        @media (max-width: 1400px) {
            #output-container {
                margin-right: 0; /* Remove margin when right panel is hidden */
            }
        }
        #inputArea {
            padding: 5px;
            background-color: black;
        }
        .bottom-container {
            display: flex;
            /* 實際 left / width 由 JS 依 #output 位置同步 */
            right: var(--right-panel-width);
            box-sizing: border-box;
            position: fixed;
            bottom: 0;
            left: 0;
            --bottom-container-height: auto;
            z-index: 1000;
        }
        .left-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #chatArea {
            width: 50%;
            background-color: #1a1a1a;
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 10px;
            color: white;
            font-family: 'Consolas', 'Courier New', monospace;
            line-height: 0.4;
        }
        #inputBox {
            background-color: white;
            color: black;
        }
        #sendButton {
            min-width: 60px;
        }
        #inputArea {
            position: relative;
        }
        #themeSelector {
            width: 42px;
            height: 38px;
            flex: 0 0 auto;
        }
        #settingsPanel[hidden] {
            display: none !important;
        }
        #settingsPanel {
            position: absolute;
            z-index: 1100;
            right: 4px;
            bottom: calc(100% + 10px);
            width: min(460px, calc(100vw - 24px));
            min-height: 540px;
            padding: 28px 24px 24px;
            color: #382719;
            border: 0;
            background:
                radial-gradient(ellipse at 50% 0, #fff4ce99, transparent 70%),
                repeating-linear-gradient(3deg, #ddc28c 0, #e8d5a9 2px, #dfc995 4px, #e8d5a9 7px);
            box-shadow: 0 12px 32px #000b, inset 0 0 24px #90652c55;
            font-family: Georgia, "Noto Serif CJK TC", serif;
        }
        #settingsPanel.is-macos {
            padding-right: 24px;
            padding-left: 24px;
        }
        #settingsPanel::before,
        #settingsPanel::after {
            position: absolute;
            right: 0;
            left: 0;
            height: 12px;
            content: "";
            background: linear-gradient(180deg, #8c6237, #d2b477 40%, #9a7045);
            box-shadow: 0 2px 4px #432b1770;
        }
        #settingsPanel::before { top: 0; }
        #settingsPanel::after { bottom: 0; }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            margin: 0 0 14px;
        }
        #settingsPanel h2 {
            margin: 0;
            color: #4a2d17;
            font-family: Georgia, "Noto Serif CJK TC", serif;
            font-size: 22px;
        }
        #settingsPanel.is-macos .settings-header {
            padding-left: 56px;
        }
        #settingsPanel:not(.is-macos) .settings-header {
            padding-right: 42px;
        }
        .settings-window-control {
            position: absolute;
            top: 17px;
            right: 17px;
            display: grid;
            width: 25px;
            height: 25px;
            place-items: center;
            padding: 0;
            color: #382719;
            border: 1px solid #8e6335;
            border-radius: 50%;
            background: linear-gradient(#f3dfb2, #c8a36a);
            box-shadow: 0 1px 3px #442a1470;
            line-height: 1;
        }
        #settingsPanel.is-macos .settings-window-control {
            right: auto;
            left: 17px;
        }
        .settings-reset-button {
            flex: 0 0 auto;
            padding: 3px 10px;
            color: #382719;
            border: 1px solid #8e6335;
            background: #e7d09e;
            font-family: inherit;
        }
        #settingsPanel label,
        #settingsPanel legend {
            color: #382719;
            font-weight: 600;
        }
        #settingsPanel .settings-notification-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        #settingsPanel .form-check-input {
            border-color: #8e6335;
        }
        #settingsPanel .form-control,
        #settingsPanel .form-select {
            color: #2f2117;
            border-color: #9c784a;
            background-color: #f5e8c9dd;
        }
        #settingsPanel fieldset {
            margin: 16px 0;
            padding: 10px 12px 12px;
            border: 1px solid #9c784a;
            background: #f5e8c955;
        }
        #settingsPanel legend {
            float: none;
            width: auto;
            margin: 0;
            padding: 0 6px;
            font-size: 15px;
        }
        .status-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .status-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 400 !important;
        }
        .settings-credential-row {
            display: grid;
            grid-template-columns: 3.5em minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }
        .settings-credential-row + .settings-credential-row {
            margin-top: 8px;
        }
        .settings-credential-row .form-label {
            margin: 0;
        }
        .redeem-code-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .redeem-code-row label {
            flex: 0 0 auto;
            margin: 0;
        }
        .redeem-code-row input {
            min-width: 0;
        }
        .redeem-code-row button {
            flex: 0 0 auto;
        }
        /* 設定面板欄位高度縮小 20% (38px -> 30px)，覆蓋主題樣式 */
        #settingsPanel #savedAccount,
        #settingsPanel #savedPassword,
        #settingsPanel #themeColor,
        #settingsPanel #redeemCodeInput,
        #settingsPanel #redeemCodeButton {
            height: 30px;
            min-height: 30px;
            padding-top: 2px;
            padding-bottom: 2px;
            line-height: 1.2;
        }
        #settingsPanel .settings-theme-row {
            margin-top: 12px;
        }
        #settingsError {
            margin-top: 8px;
            color: #8b1d1d;
            font-size: 13px;
        }
        @media (max-width: 480px) {
            #settingsPanel {
                right: -4px;
                width: calc(100vw - 16px);
                padding-right: 14px;
                padding-left: 14px;
            }
            #settingsPanel.is-macos {
                padding-left: 14px;
            }
            .status-options {
                gap: 8px 6px;
            }
            .status-options label {
                gap: 4px;
                font-size: 12px;
            }
        }
        [data-status-key][hidden] {
            display: none !important;
        }
        .status-effects[hidden],
        .status-combat[hidden] {
            display: none !important;
        }
        body.theme-dark-fantasy .status-effects[hidden],
        body.theme-dark-fantasy .status-combat[hidden] {
            display: none !important;
        }
        .progress {
            height: 8px;
            margin: 1px 0;
        }
        /* New styles for equipment and inventory */
        .right-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: var(--right-panel-width);
            box-sizing: border-box;
            height: 100vh;
            background-color: #1a1a1a;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .equipment-panel, .inventory-panel {
            background-color: #2a2a2a;
            padding: 3px;
            border-radius: 5px;
            display: none;
        }
        .equipment-panel.active, .inventory-panel.active {
            display: block;
        }
        .equipment-panel h3, .inventory-panel h3 {
            color: #87ceeb;
            margin-bottom: 2px;
            font-size: 20px;
        }
        .equipment-list, .inventory-list {
            color: #fff;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.2;
            height: calc(100vh - 520px);
            min-height: 120px;
            overflow-y: auto;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 1px;
            background-color: #3a3a3a;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.8s;
        }
        .tab-btn:hover {
            background-color: #4a4a4a;
        }
        .tab-btn.active {
            background-color: #5a5a5a;
            border-bottom: 4px solid #87ceeb;
        }
        /* Hide right panel on smaller screens */
        @media (max-width: 1400px) {
            .right-panel {
                display: none;
            }
            .bottom-container {
                width: 100vw;
            }
            .left-panel,
            #chatArea {
                flex: 1 1 50%;
                width: 50%;
            }
        }
        /* 九宮格按鈕樣式 */
        .mobile-numpad {
        display: none;
        position: fixed;
        top: 8px;
        right: 8px;
        transform: none;
        margin: 0;
        width: auto;
        opacity: 0.7;
        background: none;   /* 去掉底色 */
        border-radius: 0;
        padding: 0;
        z-index: 10;
        }
        .numpad-row {
        display: flex;
        justify-content: flex-end; /* 靠右 */
        }
        .numpad-btn {
        width: 48px;
        height: 48px;
        margin: 0;                /* 沒有間隔 */
        font-size: 1.4rem;
        font-weight: bold;
        color: #ffffff3f;
        background: #7660f51f;         /* 去掉底色 */
        border: none;
        border-radius: 12px;
        outline: none;
        transition: background 0.2s;
        }
        .numpad-btn:active {
        background: rgba(0,0,0,0.2);
        }
        @media (max-width: 768px) {
        .split-view #output-top {
            max-height: 0;
            opacity: 0;
            border-bottom: 1px solid transparent;
        }
        .mobile-numpad {
            display: block;
            z-index: 1001;
        }
        .bottom-container {
            flex-direction: column;
        }
        .left-panel {
            order: 1;
            flex: 0 0 auto;
            width: 100%;
        }
        #chatArea {
            order: 2;
            flex: 0 0 auto;
            width: 100%;
            border-left: none;
            border-top: 1px solid #333;
        }
        #targetInfoBar {
            display: none !important;
        }
        }

        body.theme-dark-fantasy {
            --df-bg: #111318;
            --df-surface: #181b21;
            --df-panel: #20232b;
            --df-elevated: #292d35;
            --df-border: #49402f;
            --df-border-soft: #332f28;
            --df-text: #e6dfcf;
            --df-secondary: #aaa393;
            --df-muted: #777366;
            --df-gold: #c5a15d;
            --df-gold-highlight: #e0bd79;
            --df-hp: #b94b4b;
            --df-mana: #4778bd;
            --df-move: #b58b43;
            --df-success: #668b65;
            --df-danger: #a94343;
            --df-font-ui: "Segoe UI", "Noto Sans CJK TC", sans-serif;
            --df-font-title: Georgia, "Noto Serif CJK TC", serif;
            --df-font-game: "Noto Sans Mono CJK", "Cascadia Mono", Consolas, monospace;
            background: var(--df-bg);
            color: var(--df-text);
            color-scheme: dark;
            font-family: var(--df-font-ui);
            font-size: 18px;
            overflow: hidden;
        }

        body.theme-dark-fantasy .d-flex.flex-column.h-100 {
            min-height: 0;
        }

        body.theme-dark-fantasy #output-container {
            margin-right: var(--right-panel-width);
            padding: 14px 16px 0;
            background: var(--df-bg);
            border-right: 1px solid var(--df-border-soft);
        }

        body.theme-dark-fantasy #output,
        body.theme-dark-fantasy #output-top {
            padding: 18px 22px;
            background: var(--df-surface);
            color: var(--df-text);
            font-family: var(--df-font-game);
            font-size: 16px;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            scrollbar-color: var(--df-border) var(--df-surface);
        }

        body.theme-dark-fantasy #output {
            border: 1px solid var(--df-border-soft);
            border-bottom: 0;
            box-shadow: inset 0 1px 5px #0008;
        }

        body.theme-dark-fantasy #output-top {
            color: var(--df-secondary);
            border: 1px solid var(--df-border-soft);
        }

        body.theme-dark-fantasy .split-view #output-top {
            border-bottom-color: var(--df-border);
        }

        body.theme-dark-fantasy .bottom-container {
            gap: 8px;
            padding: 0 0 12px;
            align-items: stretch;
            box-sizing: border-box;
            background: linear-gradient(180deg, transparent, var(--df-bg) 14px);
        }

        body.theme-dark-fantasy .left-panel,
        body.theme-dark-fantasy #chatArea,
        body.theme-dark-fantasy #statusBar,
        body.theme-dark-fantasy #targetInfoBar,
        body.theme-dark-fantasy #inputArea {
            min-width: 0;
            color: var(--df-text);
            background: var(--df-panel) !important;
            border: 1px solid var(--df-border);
            box-shadow: inset 0 1px 0 #ffffff08, 0 4px 14px #0005;
        }

        body.theme-dark-fantasy #targetInfoBar {
            min-height: 38px;
            padding: 6px 12px;
            gap: 5px;
            font-family: var(--df-font-ui);
            font-size: 14px !important;
        }

        body.theme-dark-fantasy #targetInfoBar .target-icon,
        body.theme-dark-fantasy #targetName,
        body.theme-dark-fantasy #targetHp {
            color: var(--df-hp) !important;
        }

        body.theme-dark-fantasy #targetInfoBar .target-arrow-icon,
        body.theme-dark-fantasy #targetTargetName,
        body.theme-dark-fantasy #targetTargetHp {
            color: var(--df-gold-highlight) !important;
        }

        body.theme-dark-fantasy #statusBar {
            gap: 8px 14px !important;
            padding: 9px 12px;
            border-top: 0;
            flex: 1 1 auto;
            align-content: center;
        }

        body.theme-dark-fantasy .status-hp,
        body.theme-dark-fantasy .status-mana,
        body.theme-dark-fantasy .status-move,
        body.theme-dark-fantasy .status-level,
        body.theme-dark-fantasy .status-gold,
        body.theme-dark-fantasy .status-combat-stat {
            color: var(--df-secondary);
            align-items: center;
            white-space: nowrap;
            font-size: 14px;
        }

        body.theme-dark-fantasy .status-combat {
            display: flex !important;
            flex-wrap: wrap;
        }

        body.theme-dark-fantasy .status-hp .status-icon { color: var(--df-hp); }
        body.theme-dark-fantasy .status-mana .status-icon { color: var(--df-mana); }
        body.theme-dark-fantasy .status-move .status-icon { color: var(--df-move); }
        body.theme-dark-fantasy .status-level .status-icon,
        body.theme-dark-fantasy .status-gold .status-icon { color: var(--df-gold); }
        body.theme-dark-fantasy .status-combat-stat .status-icon { color: var(--df-gold-highlight); }

        body.theme-dark-fantasy .fixed-width {
            color: var(--df-text);
            font-family: var(--df-font-game);
            font-variant-numeric: tabular-nums;
        }

        body.theme-dark-fantasy .progress {
            height: 5px;
            margin: 4px 0 0;
            overflow: hidden;
            background: var(--df-bg);
            border: 1px solid var(--df-border-soft);
        }

        body.theme-dark-fantasy .status-hp .progress-bar { background-color: var(--df-hp) !important; }
        body.theme-dark-fantasy .status-mana .progress-bar { background-color: var(--df-mana) !important; }
        body.theme-dark-fantasy .status-move .progress-bar { background-color: var(--df-move) !important; }

        body.theme-dark-fantasy .status-effect {
            padding: 3px 7px;
            color: var(--df-muted);
            background: var(--df-bg);
            border: 1px solid var(--df-border-soft);
            font-size: 13px;
            white-space: nowrap;
        }

        body.theme-dark-fantasy .status-effect.poison.active {
            color: var(--df-success);
            border-color: var(--df-success);
        }

        body.theme-dark-fantasy .status-effect.burn.active,
        body.theme-dark-fantasy .status-effect.bleed.active {
            color: var(--df-hp);
            border-color: var(--df-danger);
        }

        body.theme-dark-fantasy #inputArea {
            gap: 8px !important;
            padding: 8px;
            border-top: 0;
        }

        body.theme-dark-fantasy #inputBox,
        body.theme-dark-fantasy #themeColor {
            min-height: 38px;
            color: var(--df-text);
            background-color: var(--df-bg);
            border: 1px solid var(--df-border);
            border-radius: 2px;
            font-family: var(--df-font-game);
            font-size: 18px;
            box-shadow: inset 0 1px 4px #0008;
        }

        body.theme-dark-fantasy #inputBox::placeholder {
            color: var(--df-muted);
        }

        body.theme-dark-fantasy #inputBox:focus,
        body.theme-dark-fantasy #themeColor:focus {
            border-color: var(--df-gold);
            box-shadow: 0 0 0 2px #c5a15d33, inset 0 1px 4px #0008;
        }

        body.theme-dark-fantasy #themeSelector {
            color: var(--df-text);
            background: var(--df-elevated);
            border-color: var(--df-border);
        }

        body.theme-dark-fantasy .btn,
        body.theme-dark-fantasy .tab-btn,
        body.theme-dark-fantasy .numpad-btn {
            color: var(--df-text);
            background: var(--df-elevated);
            border: 1px solid var(--df-border);
            border-radius: 2px;
            font-family: var(--df-font-ui);
            font-size: 18px;
            transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
        }

        body.theme-dark-fantasy #sendButton {
            min-height: 38px;
            color: #17140e;
            background: var(--df-gold);
            border-color: var(--df-gold-highlight);
            font-size: 16px;
            font-weight: 700;
        }

        body.theme-dark-fantasy #sendButton:hover,
        body.theme-dark-fantasy #sendButton:focus-visible {
            background: var(--df-gold-highlight);
        }

        body.theme-dark-fantasy .btn:hover,
        body.theme-dark-fantasy .tab-btn:hover,
        body.theme-dark-fantasy .numpad-btn:hover {
            color: var(--df-gold-highlight);
            background: #34332f;
            border-color: var(--df-gold);
        }

        body.theme-dark-fantasy .btn:active,
        body.theme-dark-fantasy .tab-btn:active,
        body.theme-dark-fantasy .numpad-btn:active {
            background: #121419;
            box-shadow: inset 0 2px 5px #0009;
        }

        body.theme-dark-fantasy .btn:disabled,
        body.theme-dark-fantasy .tab-btn:disabled,
        body.theme-dark-fantasy .numpad-btn:disabled {
            color: var(--df-muted);
            background: var(--df-surface);
            border-color: var(--df-border-soft);
            cursor: not-allowed;
        }

        body.theme-dark-fantasy :focus-visible {
            outline: 2px solid var(--df-gold-highlight);
            outline-offset: 2px;
        }

        body.theme-dark-fantasy #chatArea {
            padding: 12px;
            color: var(--df-secondary);
            font-family: var(--df-font-game);
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;

            fill: #514326;
            stroke: #e4c36e;
            stroke-width: 3;
        }

            fill: #3e4a4b;
            stroke: #a7d1d6;
        }

        /* right-panel 左側寬度拖移控制 */
        .right-panel-resizer {
            position: fixed;
            top: 0;
            right: var(--right-panel-width);
            width: 10px;
            height: 100vh;
            transform: translateX(50%);
            cursor: col-resize;
            z-index: 1002;
            touch-action: none;
        }
        .right-panel-resizer[hidden] {
            display: none;
        }
        .right-panel-resizer::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            background: transparent;
            transition: background-color 0.15s;
        }
        .right-panel-resizer:hover::before,
        body.is-resizing-right-panel .right-panel-resizer::before {
            background: #87ceeb;
        }
        .right-panel-resizer::after {
            content: "⇔ 按住左鍵拖移調整寬度";
            position: absolute;
            top: 50%;
            right: calc(100% + 6px);
            transform: translateY(-50%);
            padding: 4px 8px;
            white-space: nowrap;
            font-size: 12px;
            color: #fff;
            background: #000c;
            border: 1px solid #87ceeb;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .right-panel-resizer:hover::after {
            opacity: 1;
        }
        body.is-resizing-right-panel .right-panel-resizer::after {
            opacity: 0;
        }
        body.is-resizing-right-panel {
            cursor: col-resize;
            user-select: none;
        }
        body.theme-dark-fantasy .right-panel-resizer:hover::before,
        body.theme-dark-fantasy.is-resizing-right-panel .right-panel-resizer::before {
            background: var(--df-gold);
        }
        body.theme-dark-fantasy .right-panel-resizer::after {
            border-color: var(--df-gold);
        }
    </style>
</head>

        let isSplitting = false;
        let isUserScrolling = false;
        let scrollTimer;
        let ws;
        let inputMode = null;
        let autoLoginStage = 'account';
        let inactivityTimer;
        let commandHistory = []; // 儲存命令歷史
        let currentHistoryIndex = -1; // 當前歷史記錄索引

        function createMapSvgElement(name, attributes = {}) {
            const element = document.createElementNS('http://www.w3.org/2000/svg', name);
            for (const [key, value] of Object.entries(attributes)) {
                element.setAttribute(key, value);
            }
            return element;
        }

        function addMapNode(
            svg,
            room,
            x,
            y,
            isCurrent,
            direction,
            action,
            verticalActions = {}
        ) {
            const width = 156;
            const height = 64;
            const group = createMapSvgElement('g', {
                class: `map-room-node${isCurrent ? ' current' : ''}${action ? ' neighbor' : ''}`,
                transform: `translate(${x - width / 2}, ${y - height / 2})`
            });
            const rect = createMapSvgElement('rect', {
                x: 0,
                y: 0,
                width,
                height,
                rx: 12
            });
            const title = createMapSvgElement('text', {
                x: width / 2,
                y: height / 2,
                'text-anchor': 'middle',
                'dominant-baseline': 'middle'
            });
            const roomName = Array.from(room.name || `房間 ${room.id}`);
            title.textContent = roomName.slice(0, 5).join('');
            group.append(rect, title);
            for (const [index, verticalDirection] of ['up', 'down'].entries()) {
                if (!room.connections?.[verticalDirection]) continue;
                const indicator = createMapSvgElement('text', {
                    class: 'map-vertical-indicators',
                    x: width / 2 + (index === 0 ? -12 : 12),
                    y: 61,
                    'text-anchor': 'middle'
                });
                indicator.textContent = verticalDirection === 'up' ? '↑' : '↓';
                if (verticalActions[verticalDirection]) {
                    indicator.setAttribute('role', 'button');
                    indicator.setAttribute('tabindex', '0');
                    indicator.setAttribute(
                        'aria-label',
                        `${mapDirectionNames[verticalDirection]}：移動`
                    );
                    indicator.addEventListener('click', verticalActions[verticalDirection]);
                    indicator.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            verticalActions[verticalDirection]();
                        }
                    });
                }
                group.append(indicator);
            }
            if (action) {
                group.setAttribute('role', 'button');
                group.setAttribute('tabindex', '0');
                group.setAttribute(
                    'aria-label',
                    `${mapDirectionNames[direction]}：${room.name}，按下移動`
                );
                group.addEventListener('click', action);
                group.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        action();
                    }
                });
            }
            svg.append(group);
        }

        function addMapLink(svg, from, to, direction, vertical = false) {
            const line = createMapSvgElement('line', {
                class: `map-link${vertical ? ' vertical' : ''}`,
                x1: from.x,
                y1: from.y,
                x2: to.x,
                y2: to.y
            });
            const label = createMapSvgElement('text', {
                class: 'map-direction-label',
                x: (from.x + to.x) / 2,
                y: (from.y + to.y) / 2 - 8,
                'text-anchor': 'middle'
            });
            label.textContent = mapDirectionNames[direction] || direction;
            svg.append(line, label);
        }

        function fitMapSvgToContent(svg, fixedViewBox = null) {
            if (fixedViewBox) {
                svg.setAttribute('viewBox', fixedViewBox);
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                return;
            }

            const bounds = svg.getBBox();
            if (!bounds.width || !bounds.height) {
                svg.hidden = true;
                return;
            }

            const padding = 12;
            svg.setAttribute(
                'viewBox',
                `${bounds.x - padding} ${bounds.y - padding} ${bounds.width + padding * 2} ${bounds.height + padding * 2}`
            );
            svg.removeAttribute('width');
            svg.removeAttribute('height');
        }

        function sendMapMove(direction) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            sendMessage(direction);
        }

        function getAreaMapPositions(rooms, currentRoomId) {
            const roomById = new Map(rooms.map(room => [String(room.id), room]));
            const positions = new Map();
            const occupied = new Map();

            function place(id, desired) {
                let { x, y } = desired;
                let radius = 0;

                while (occupied.has(`${x},${y}`)) {
                    radius += 1;
                    for (let dx = -radius; dx <= radius; dx += 1) {
                        const dy = radius - Math.abs(dx);
                        const candidates = dy === 0
                            ? [[dx, 0]]
                            : [[dx, dy], [dx, -dy]];
                        const free = candidates.find(([offsetX, offsetY]) =>
                            !occupied.has(`${desired.x + offsetX},${desired.y + offsetY}`)
                        );
                        if (free) {
                            [x, y] = [desired.x + free[0], desired.y + free[1]];
                            break;
                        }
                    }
                }

                const position = { x, y };
                occupied.set(`${x},${y}`, String(id));
                positions.set(String(id), position);
                return position;
            }

            const pending = [];
            if (roomById.has(String(currentRoomId))) {
                place(currentRoomId, { x: 0, y: 0 });
                pending.push(String(currentRoomId));
            }

            function visitReachableRooms() {
                while (pending.length > 0) {
                    const id = pending.shift();
                    const room = roomById.get(id);
                    const position = positions.get(id);
                    for (const [direction, target] of Object.entries(room.connections || {})) {
                        const targetId = String(target.id);
                        const offset = mapDirectionOffsets[direction];
                        if (!offset || !roomById.has(targetId) || positions.has(targetId)) {
                            continue;
                        }
                        place(targetId, {
                            x: position.x + offset.x,
                            y: position.y + offset.y
                        });
                        pending.push(targetId);
                    }
                }
            }

            visitReachableRooms();
            rooms.forEach((room, index) => {
                const id = String(room.id);
                if (positions.has(id)) return;
                place(id, { x: index * 2, y: 0 });
                pending.push(id);
                visitReachableRooms();
            });

            return positions;
        }

        function renderNearbyMap(svg, currentRoom) {
            const rooms = mapState.data.rooms;
            const roomById = new Map(rooms.map(room => [String(room.id), room]));
            const pointFor = (room) => ({
                x: 500 + room.x * 175,
                y: 300 + room.y * 100
            });
            const directExits = new Map(
                Object.entries(currentRoom.connections || {}).map(([direction, target]) => [
                    String(target.id),
                    direction
                ])
            );
            const drawnLinks = new Set();

            for (const room of rooms) {
                for (const [direction, target] of Object.entries(room.connections || {})) {
                    if (!roomById.has(String(target.id))) continue;
                    const key = [String(room.id), String(target.id)].sort().join(':');
                    if (drawnLinks.has(key)) continue;
                    drawnLinks.add(key);
                    addMapLink(svg, pointFor(room), pointFor(roomById.get(String(target.id))), direction);
                }
            }

            for (const room of rooms) {
                const direction = directExits.get(String(room.id));
                const verticalActions = {};
                if (room.id === currentRoom.id) {
                    for (const verticalDirection of ['up', 'down']) {
                        if (currentRoom.connections?.[verticalDirection]) {
                            verticalActions[verticalDirection] = () => sendMapMove(verticalDirection);
                        }
                    }
                }
                const point = pointFor(room);
                addMapNode(
                    svg,
                    room,
                    point.x,
                    point.y,
                    String(room.id) === String(currentRoom.id),
                    direction,
                    direction ? () => sendMapMove(direction) : null,
                    verticalActions
                );
            }
        }

        function renderAreaMap(svg, currentRoom) {
            const rooms = mapState.data.areaRooms || [];
            const roomById = new Map(rooms.map(room => [String(room.id), room]));
            const positions = getAreaMapPositions(rooms, currentRoom.id);
            const roomPositions = [...positions.values()];
            const minX = Math.min(...roomPositions.map(position => position.x));
            const maxX = Math.max(...roomPositions.map(position => position.x));
            const minY = Math.min(...roomPositions.map(position => position.y));
            const maxY = Math.max(...roomPositions.map(position => position.y));
            const margin = 130;
            const stepX = 190;
            const stepY = 120;
            const pointFor = (roomId) => {
                const position = positions.get(String(roomId));
                return {
                    x: margin + (position.x - minX) * stepX,
                    y: margin + (position.y - minY) * stepY
                };
            };
            const drawnLinks = new Set();
            for (const room of rooms) {
                for (const [direction, target] of Object.entries(room.connections || {})) {
                    if (!roomById.has(String(target.id))) continue;
                    const key = [String(room.id), String(target.id)].sort().join(':');
                    if (drawnLinks.has(key)) continue;
                    drawnLinks.add(key);
                    addMapLink(
                        svg,
                        pointFor(room.id),
                        pointFor(target.id),
                        direction,
                        direction === 'up' || direction === 'down'
                    );
                }
            }

            for (const room of rooms) {
                const exit = Object.entries(currentRoom.connections || {}).find(
                    ([, target]) => String(target.id) === String(room.id)
                );
                const verticalActions = {};
                if (String(room.id) === String(currentRoom.id)) {
                    for (const verticalDirection of ['up', 'down']) {
                        if (currentRoom.connections?.[verticalDirection]) {
                            verticalActions[verticalDirection] = () => sendMapMove(verticalDirection);
                        }
                    }
                }
                addMapNode(
                    svg,
                    room,
                    pointFor(room.id).x,
                    pointFor(room.id).y,
                    String(room.id) === String(currentRoom.id),
                    exit?.[0],
                    exit ? () => sendMapMove(exit[0]) : null,
                    verticalActions
                );
            }
        }

        // 初始化滾動事件監聽
        function initScrollHandlers() {
            // 監聽 output 的滾動事件
            outputDiv.addEventListener('scroll', handleOutputScroll);
            
            // 監聽 output-top 的滾動事件
            outputTop.addEventListener('scroll', handleTopScroll);
            
            // 只有使用者主動捲動才允許開啟 output-top
            // (視窗縮放造成的 scroll 事件不算)
            ['touchmove', 'keydown'].forEach(type => {
                outputDiv.addEventListener(type, markUserScrollIntent, { passive: true });
            });
            outputDiv.addEventListener('pointerdown', () => {
                isOutputPointerDown = true; // 拖曳捲軸
            });
            window.addEventListener('pointerup', () => {
                isOutputPointerDown = false;
            });
            window.addEventListener('pointercancel', () => {
                isOutputPointerDown = false;
            });

            // 監聽滾輪事件來檢測用戶滾動
            outputDiv.addEventListener('wheel', () => {
                markUserScrollIntent();
                isUserScrolling = true;
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => {
                    isUserScrolling = false;
                }, 1000);
            });
            
            // 定期檢查是否需要自動滾動
            setInterval(checkAutoScroll, 100);
        }
        
        let userScrollIntentUntil = 0;
        let isOutputPointerDown = false;
        function markUserScrollIntent() {
            userScrollIntentUntil = Date.now() + 800;
        }
        function hasUserScrollIntent() {
            return isOutputPointerDown || Date.now() < userScrollIntentUntil;
        }

        // 處理 output 的滾動事件
        function handleOutputScroll() {
            // 如果已經在分割模式，不處理
            if (isSplitting) return;

            // 非使用者捲動 (例如調整視窗大小) 不開啟 output-top，維持在底部
            if (!hasUserScrollIntent()) {
                outputDiv.scrollTop = outputDiv.scrollHeight;
                return;
            }

            // 如果用戶向上滾動，切換到分割模式
            if (outputDiv.scrollTop < outputDiv.scrollHeight - outputDiv.clientHeight - 10) {
                splitOutput();
            }
        }
        
        // 處理頂部視窗的滾動事件
        function handleTopScroll() {
            // 如果滾動到底部，合併視窗
            if (outputTop.scrollHeight - outputTop.scrollTop - outputTop.clientHeight < 10) {
                mergeOutput();
            }
        }
        
        // 分割視窗
        function splitOutput() {
            if (!canUseSplitView()) {
                mergeOutput();
                return;
            }
            if (isSplitting) return;
            
            // 複製內容到頂部視窗
            outputTop.innerHTML = outputDiv.innerHTML;
            
            // 設置滾動位置
            const scrollRatio = outputDiv.scrollTop / (outputDiv.scrollHeight - outputDiv.clientHeight);
            const topScrollPos = (outputTop.scrollHeight - outputTop.clientHeight) * (1 - scrollRatio);
            outputTop.scrollTop = topScrollPos;
            
            // 添加分割視窗樣式
            outputContainer.classList.add('split-view');
            isSplitting = true;
            
            // 滾動到底部視窗
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        // 合併視窗
        function mergeOutput() {
            if (!isSplitting) return;
            
            // 移除分割視窗樣式
            outputContainer.classList.remove('split-view');
            isSplitting = false;
            
            // 清空頂部視窗內容
            outputTop.innerHTML = '';
            
            // 滾動到底部
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        // 檢查是否需要自動滾動
        function checkAutoScroll() {
            if (!isUserScrolling && !isSplitting) {
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }
        }

        function setChatAreaHeight() {
            const inputArea = document.getElementById('inputArea');
            const statusBar = document.getElementById('statusBar');
            const targetInfoBar = document.getElementById('targetInfoBar');
            const chatArea = document.getElementById('chatArea');
            const bottomContainer = document.querySelector('.bottom-container');
            const outputContainer = document.getElementById('output-container');
            const leftPanel = document.querySelector('.left-panel');
            const isMobileLayout = window.matchMedia('(max-width: 768px)').matches;
            const inputHeight = inputArea.offsetHeight;
            const statusHeight = statusBar.offsetHeight;
            const targetInfoHeight = targetInfoBar.offsetHeight;
            const leftContentHeight = inputHeight + statusHeight + targetInfoHeight;
            // mobile: chatArea 固定為視窗高度的 20%
            const chatHeight = isMobileLayout
                ? Math.round(window.innerHeight * 0.2)
                : leftContentHeight;
            const leftPanelHeight = Math.max(
                leftContentHeight,
                leftPanel.scrollHeight
            );
            const containerStyles = getComputedStyle(bottomContainer);
            const verticalPadding = parseFloat(containerStyles.paddingTop)
                + parseFloat(containerStyles.paddingBottom);
            const verticalGap = isMobileLayout ? parseFloat(containerStyles.rowGap) : 0;
            const bottomHeight = isMobileLayout
                ? leftPanelHeight + chatHeight + verticalGap + verticalPadding
                : Math.max(leftPanelHeight, chatHeight) + verticalPadding;

            document.body.style.setProperty('--mobile-bottom-height', `${bottomHeight}px`);
            chatArea.style.height = `${chatHeight}px`;
            bottomContainer.style.height = `${bottomHeight}px`;
            outputContainer.style.marginBottom = `${bottomHeight}px`;

            // bottom-container 寬度與 #output 對齊
            const outputRect = document.getElementById('output').getBoundingClientRect();
            bottomContainer.style.left = `${outputRect.left}px`;
            bottomContainer.style.width = `${outputRect.width}px`;

            // right-panel 隱藏時一併隱藏拖移控制

        // ===== right-panel 寬度拖移 =====
        (function initRightPanelResizer() {
            const RIGHT_PANEL_WIDTH_KEY = 'marsII.rightPanelWidth';
            const MIN_WIDTH = 280;
            const MIN_OUTPUT_WIDTH = 360;
            const resizer = document.getElementById('rightPanelResizer');
            const root = document.documentElement;
            let pendingFrame = 0;

            function clampWidth(width) {
                const maxWidth = Math.max(MIN_WIDTH, window.innerWidth - MIN_OUTPUT_WIDTH);
                return Math.round(Math.min(Math.max(width, MIN_WIDTH), maxWidth));
            }

            function applyWidth(width) {
                root.style.setProperty('--right-panel-width', `${clampWidth(width)}px`);
                if (!pendingFrame) {
                    pendingFrame = window.requestAnimationFrame(() => {
                        pendingFrame = 0;
                        // 觸發 resize，讓地圖與底部區塊重新計算
                        window.dispatchEvent(new Event('resize'));
                    });
                }
            }

            try {
                const saved = parseInt(localStorage.getItem(RIGHT_PANEL_WIDTH_KEY), 10);
                if (Number.isFinite(saved)) applyWidth(saved);
            } catch (e) { /* storage 不可用時使用預設寬度 */ }

            resizer.addEventListener('pointerdown', event => {
                if (event.button !== 0) return;
                event.preventDefault();
                resizer.setPointerCapture(event.pointerId);
                document.body.classList.add('is-resizing-right-panel');
            });

            resizer.addEventListener('pointermove', event => {
                if (!resizer.hasPointerCapture(event.pointerId)) return;
                applyWidth(window.innerWidth - event.clientX);
            });

            resizer.addEventListener('pointerup', event => {
                if (resizer.hasPointerCapture(event.pointerId)) {
                    resizer.releasePointerCapture(event.pointerId);
                }
            });

            // pointerup / pointercancel 後都會觸發
            resizer.addEventListener('lostpointercapture', () => {
                document.body.classList.remove('is-resizing-right-panel');
                try {
                    const width = parseInt(getComputedStyle(root).getPropertyValue('--right-panel-width'), 10);
                    localStorage.setItem(RIGHT_PANEL_WIDTH_KEY, String(width));
                } catch (e) { /* ignore */ }
            });

            // 視窗縮小時確保寬度仍在範圍內
            window.addEventListener('resize', () => {
                const current = parseInt(getComputedStyle(root).getPropertyValue('--right-panel-width'), 10);
                const clamped = clampWidth(current);
                if (clamped !== current) root.style.setProperty('--right-panel-width', `${clamped}px`);
            });
        })();

        function openSettingsDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('marsII-settings', 1);
                request.onupgradeneeded = () => {
                    request.result.createObjectStore('keys');
                };
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function getCredentialKey(createIfMissing) {
            const database = await openSettingsDatabase();
            const existingKey = await new Promise((resolve, reject) => {
                const transaction = database.transaction('keys', 'readonly');
                const request = transaction.objectStore('keys').get('credentials');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            if (existingKey || !createIfMissing) {
                database.close();
                return existingKey;
            }

            const key = await window.crypto.subtle.generateKey(
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            await new Promise((resolve, reject) => {
                const transaction = database.transaction('keys', 'readwrite');
                transaction.objectStore('keys').put(key, 'credentials');
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error);
            });
            database.close();
            return key;
        }

        function bytesToBase64(bytes) {
            return btoa(String.fromCharCode(...new Uint8Array(bytes)));
        }

        function base64ToBytes(value) {
            return Uint8Array.from(atob(value), character => character.charCodeAt(0));
        }

        async function encryptPassword(password) {
            if (!password) return null;
            if (!window.crypto?.subtle || !window.indexedDB) {
                throw new Error('此瀏覽器不支援安全的密碼儲存，密碼未被保存。');
            }
            const key = await getCredentialKey(true);
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await window.crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                new TextEncoder().encode(password)
            );
            return {
                iv: bytesToBase64(iv),
                ciphertext: bytesToBase64(ciphertext)
            };
        }

        async function decryptPassword(encryptedPassword) {
            if (!window.crypto?.subtle || !window.indexedDB) {
                throw new Error('此瀏覽器不支援解密已儲存的密碼。');
            }
            const key = await getCredentialKey(false);
            if (!key) throw new Error('找不到密碼解密金鑰，請重新輸入密碼。');
            const plaintext = await window.crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: base64ToBytes(encryptedPassword.iv) },
                key,
                base64ToBytes(encryptedPassword.ciphertext)
            );
            return new TextDecoder().decode(plaintext);
        }

                            password: encryptedPassword,

                            theme: document.getElementById('themeColor').value

                        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));

                        encryptedSavedPassword = encryptedPassword;

        async function initializeSettings() {
            const accountInput = document.getElementById('savedAccount');
            const passwordInput = document.getElementById('savedPassword');

            const themeSelect = document.getElementById('themeColor');
            STATUS_KEYS.forEach(key => {
                document.querySelector(`[data-status-setting="${key}"]`).checked =
                    currentSettings.status[key];
            });
            let storedSettings = null;
            try {
                const serializedSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
                storedSettings = serializedSettings ? JSON.parse(serializedSettings) : null;
            } catch (error) {
                showSettingsError(`無法讀取已儲存的設定：${error.message}`);
            }

            if (storedSettings && typeof storedSettings === 'object') {
                currentSettings.account = typeof storedSettings.account === 'string'
                    ? storedSettings.account
                    : '';
                currentSettings.notifyChat = storedSettings.notifyChat === true;
                chatNotificationSetting.checked = currentSettings.notifyChat;                currentSettings.status = Object.fromEntries(STATUS_KEYS.map(key => [
                    key,
                    typeof storedSettings.status?.[key] === 'boolean'
                        ? storedSettings.status[key]
                        : true
                ]));
                accountInput.value = currentSettings.account;
                STATUS_KEYS.forEach(key => {
                    document.querySelector(`[data-status-setting="${key}"]`).checked =
                        currentSettings.status[key];
                });
                applyTheme(storedSettings.theme);
                if (storedSettings.password) {
                    encryptedSavedPassword = storedSettings.password;
                    try {
                        passwordInput.value = await decryptPassword(storedSettings.password);
                        currentSettings.password = passwordInput.value;
                    } catch (error) {
                        showSettingsError(`無法解密已儲存的密碼：${error.message}`);
                    }
                }
            } else {
                const legacyTheme = localStorage.getItem(LEGACY_THEME_STORAGE_KEY);
                applyTheme(legacyTheme);
            }
            applyStatusSettings();

            accountInput.addEventListener('input', queueSettingsSave);
            passwordInput.addEventListener('input', () => {
                passwordChanged = true;
                queueSettingsSave();
            });
            chatNotificationSetting.addEventListener('change', async () => {
                if (!chatNotificationSetting.checked) {
                    currentSettings.notifyChat = false;
                    queueSettingsSave();

                    currentSettings.notifyChat = false;

                    queueSettingsSave();

                        ? await Notification.requestPermission()

                        chatNotificationSetting.checked = false;
                        currentSettings.notifyChat = false;
                        showSettingsError('瀏覽器通知權限未開啟，訊息提醒已停用。');

        function connect() {
            inputMode = null;
            autoLoginStage = 'account';
            setPasswordInputMode(false);
            ws = new WebSocket(SERVER_URL);
            ws.onopen = () => {
                setTag(); // 設置連線標記
                /*outputDiv.innerHTML += '<span style="color: white;">Mars: Origin | 瑪爾斯群英傳: 起源</span>';*/
                outputDiv.innerHTML +=
                    '<p><img src="https://marsorigin.myctw.cc/assets/images/logo.jpg" ' +
                    'alt="Mars: Origin" ' +
                    'style="max-width: 100%; height: auto; display: block;"></p>';
                outputDiv.scrollTop = outputDiv.scrollHeight; // 滾動到最底部
                resetInactivityTimer(); // 重置非活動計時器
                logWs('OPEN', `url=${SERVER_URL}`);
            };

            ws.onmessage = async (event) => {
                
                /*
                let messageOrigin;
                try {
                    messageOrigin = new URL(event.origin).hostname;
                } catch (error) {
                    return;
                }
                if (messageOrigin !== 'marsorigin.myctw.cc') {
                    return;
                }
                */
                let result = isJson(event.data);
                if (result) {
                    const pData = JSON.parse(event.data);
                    if (pData.type === 'status') {
                        updateStatus(pData);
                    }else if (pData.type === 'eqinv') {
                        updateEqInv(pData);
                    }else if (pData.type === 'chat') {
                        updateChat(pData);
                    }else if (pData.type === 'mode') {
                        inputMode = pData.mode || null;
                    }else if (pData.type === 'map') {
                        updateMap(pData);
                    }else if (pData.type === 'passwordInput') {
                        setPasswordInputMode(pData.enabled === true);
                    }
                
                }else{
                    await settingsReady;
                    const serverMessage = String(event.data);
                    if (autoLoginStage === 'account' && serverMessage.includes('請輸入您的帳號')) {
                        if (currentSettings.account && currentSettings.password) {
                            sendSavedCredential(currentSettings.account);
                            autoLoginStage = 'password';
                        } else {
                            autoLoginStage = 'manual';
                        }
                    } else if (autoLoginStage === 'password'
                        && serverMessage.includes('請輸入您的密碼')) {
                        sendSavedCredential(currentSettings.password);
                        autoLoginStage = 'sent';
                    }
                    outputDiv.innerHTML += `<p>${event.data}</p>`;
                    // 檢查並限制輸出行數
                    while (outputDiv.childNodes.length > MAX_OUTPUT_LINES) {
                        outputDiv.removeChild(outputDiv.firstChild);
                    }
                }
                outputDiv.scrollTop = outputDiv.scrollHeight; // 滾動到最底部
                resetInactivityTimer(); // 重置非活動計時器
                setTag(); // 設置連線標記
            };

            ws.onclose = () => {
                logWs('CLOSE', {
                    code: event.code,
                    reason: event.reason,
                    wasClean: event.wasClean,
                    readyState: ws.readyState
                });
                outputDiv.innerHTML += '<span style="color: red;">與伺服器中斷連線。</p>';
                outputDiv.scrollTop = outputDiv.scrollHeight; // 滾動到最底部
                removeTag(); // 清除連線標記
                disconnect();
                setTimeout(connect, 10000); // 10秒後嘗試重新連接
            };

            ws.onerror = (error) => {
                console.error('WebSocket 錯誤:', error);
                logWs('ERROR', 'WebSocket error; see close event for details '+ error);
                outputDiv.scrollTop = outputDiv.scrollHeight; // 滾動到最底部
            };
        }

        function isJson(data) {
            try{
                JSON.parse(data);
                return true;
            }catch(e){
                return false;
            }
        }

        // 回傳給 server 的顯示模式: 'mobile' | 'web'，依視窗寬度判斷 (與 mobile layout 斷點一致)
        function getClientView() {
            return window.matchMedia('(max-width: 768px)').matches ? 'mobile' : 'web';
        }

        function sendMessage(message) {
            let selectInputAfterSend = false;
            if (!message) {
                message = inputBox.value.trim();
                selectInputAfterSend = true;
            }

            if (message) {
                ws.send(JSON.stringify({ command: message, mode: inputMode, view: getClientView() }));

                // 密碼輸入：不顯示在 output、不記錄歷史、清空輸入框
                if (isPasswordInput) {
                    inputBox.value = '';
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    resetInactivityTimer();
                    return;
                }

                outputDiv.innerHTML += '<span style="color: yellow;">'+message+'</span>\n';

                // 添加到命令歷史
                if (!commandHistory.includes(message)) {
                    commandHistory.unshift(message);
                    if (commandHistory.length > MAX_COMMAND_HISTORY) {
                        commandHistory.pop();
                    }
                }
                currentHistoryIndex = -1; // 重置歷史索引
                
                outputDiv.scrollTop = outputDiv.scrollHeight; // 滾動到最底部
                if (selectInputAfterSend) inputBox.select(); // 全选文本
                resetInactivityTimer(); // 重置非活動計時器
            }
        }

        function sendSavedCredential(value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return false;
            ws.send(JSON.stringify({ command: value, mode: inputMode, view: getClientView() }));
            inputBox.value = '';
            resetInactivityTimer();
            return true;
        }

                }
            }

            document.getElementById('currentMove').textContent = '0';
            document.getElementById('maxMove').textContent = '0';
            document.querySelector('.status-move .progress-bar').style.width = '0%';

            document.getElementById('level').textContent = '0';
            document.getElementById('thirsty').textContent = '0%';
            document.getElementById('hungry').textContent = '0%';
            document.getElementById('gold').textContent = '0';

            document.getElementById('armor').textContent = '0';
            document.getElementById('damroll').textContent = '0';
            document.getElementById('hitRate').textContent = '0';
            ['str', 'int', 'dex', 'wis', 'con'].forEach(attribute => {
                document.getElementById(attribute).textContent = '0';
            });
        }

        const eqArea = document.getElementById('equipmentList');
        if (eqArea) eqArea.innerHTML = '';
        const invArea = document.getElementById('inventoryList');
        if (invArea) invArea.innerHTML = '';
    }
    </script>
