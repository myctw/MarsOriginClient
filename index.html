<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars: Origin | 瑪爾斯群英傳: 起源 </title>
    <link rel="icon" type="image/png" href="./assets/images/MO_ICON2.png">
    <!-- 暗黑破壞神主題標題字型 (離線時退回系統襯線字) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 註:Bootstrap 已提供 [hidden]{display:none!important},以下只處理會被 d-flex 等 !important 蓋掉的情況 */
        :root { --right-panel-width: 400px; }
        body {
            background-color: black;
            color: white;
            height: 100vh;
            /* iOS Safari/Chrome: 100vh 含瀏覽器工具列後方區域,改用動態視窗高度 */
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .formatted-text { tab-size: 4; }
        #output-container, #output-top, #output { background-color: black; }
        #output-container {
            flex: 1;
            position: relative;
            margin-right: var(--right-panel-width);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #output-top, #output {
            padding: 12px;
            line-height: 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre;
            overflow-y: auto;
        }
        #output-top {
            flex: 0 0 auto;
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }
        #output { flex: 1; }
        .split-view #output-top {
            max-height: 50%;
            opacity: 1;
            border-bottom: 1px solid #333;
        }
        /* output-top 未使用時完全收合 (覆蓋各主題的 padding / border) */
        body #output-container:not(.split-view) #output-top {
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
        }
        #statusBar {
            background-color: #1a1a1a;
            padding: 1px 10px;
            border-bottom: 1px solid #333;
        }
        .status-icon { margin-right: 5px; }
        .status-effect { color: #666; transition: color 0.3s ease; }
        .status-effect.poison.active { color: #00ff00; }
        .status-effect.burn.active { color: #ff4500; }
        .status-effect.bleed.active { color: #ff0000; }
        .status-hp { color: #ff0000; }
        .status-mana { color: #4169e1; }
        .status-move, .status-gold { color: #ffd700; }
        .status-level { color: #9370db; }
        .status-combat-stat { color: #ff6347; }
        .status-effects[hidden], .status-combat[hidden],
        body.theme-dark-fantasy .status-effects[hidden],
        body.theme-dark-fantasy .status-combat[hidden] {
            display: none !important;
        }
        .fixed-width { font-family: monospace; display: inline-block; }
        .bar-width { width: 5ch; }
        .progress { height: 8px; margin: 1px 0; }
        #targetInfoBar { font-size: 1.1em; background-color: #1a1a1a; }
        #targetName, #targetHp, #targetTargetName, #targetTargetHp { font-size: calc(1em + 2px); }
        #targetName, #targetHp { color: #ff4444; min-width: 90px; }
        #targetTargetName, #targetTargetHp, .target-arrow-icon { color: #ffe066; }
        .target-arrow-icon { font-size: 1.1em; }
        #inputArea { position: relative; padding: 5px; background-color: black; }
        #inputBox { background-color: white; color: black; }
        #sendButton { min-width: 60px; }
        #themeSelector { width: 42px; height: 38px; flex: 0 0 auto; }
        .bottom-container {
            /* left / width 由 JS 依 #output 位置同步 */
            display: flex;
            box-sizing: border-box;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }
        .left-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #chatArea {
            width: 50%;
            background-color: #1a1a1a;
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            line-height: 0.4;
        }

        /* ===== 設定面板 (羊皮紙卷軸,置中顯示、可由標題列拖移) ===== */
        #settingsPanel {
            position: fixed;
            z-index: 1100;
            width: min(460px, calc(100vw - 24px));
            min-height: 540px;
            max-height: calc(100vh - 16px);
            overflow-y: auto;
            padding: 28px 24px 24px;
            color: #382719;
            background:
                radial-gradient(ellipse at 50% 0, #fff4ce99, transparent 70%),
                repeating-linear-gradient(3deg, #ddc28c 0, #e8d5a9 2px, #dfc995 4px, #e8d5a9 7px);
            box-shadow: 0 12px 32px #000b, inset 0 0 24px #90652c55;
            font-family: Georgia, "Noto Serif CJK TC", serif;
        }
        #settingsPanel::before, #settingsPanel::after {
            position: absolute;
            right: 0;
            left: 0;
            height: 12px;
            content: "";
            background: linear-gradient(180deg, #8c6237, #d2b477 40%, #9a7045);
            box-shadow: 0 2px 4px #432b1770;
        }
        #settingsPanel::before { top: 0; }
        #settingsPanel::after { bottom: 0; }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            margin: 0 0 14px;
            padding-right: 42px;
            cursor: move;
            user-select: none;
            touch-action: none;
        }
        #settingsPanel.is-macos .settings-header { padding: 0 0 0 56px; }
        #settingsPanel h2 { margin: 0; color: #4a2d17; font-family: inherit; font-size: 22px; }
        .settings-window-control {
            position: absolute;
            top: 17px;
            right: 17px;
            display: grid;
            width: 25px;
            height: 25px;
            place-items: center;
            padding: 0;
            color: #382719;
            border: 1px solid #8e6335;
            border-radius: 50%;
            background: linear-gradient(#f3dfb2, #c8a36a);
            box-shadow: 0 1px 3px #442a1470;
            line-height: 1;
        }
        #settingsPanel.is-macos .settings-window-control { right: auto; left: 17px; }
        .settings-reset-button {
            flex: 0 0 auto;
            padding: 3px 10px;
            color: #382719;
            border: 1px solid #8e6335;
            background: #e7d09e;
            font-family: inherit;
        }
        #settingsPanel label, #settingsPanel legend { color: #382719; font-weight: 600; }
        #settingsPanel .settings-option-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; }
        #settingsPanel .settings-notification-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        #settingsPanel .form-check-input { border-color: #8e6335; border-radius: 4px; }
        #settingsPanel .form-control, #settingsPanel .form-select {
            color: #2f2117;
            border-color: #9c784a;
            background-color: #f5e8c9dd;
        }
        #settingsPanel .form-control, #settingsPanel .form-select,
        #settingsPanel .settings-reset-button, #settingsPanel fieldset {
            border-radius: 6px;
        }
        #settingsPanel fieldset {
            margin: 16px 0;
            padding: 10px 12px 12px;
            border: 1px solid #9c784a;
            background: #f5e8c955;
        }
        #settingsPanel legend { float: none; width: auto; margin: 0; padding: 0 6px; font-size: 15px; }
        #settingsPanel button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .status-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 400 !important;
        }
        .settings-credential-row {
            display: grid;
            grid-template-columns: 3.5em minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }
        .settings-credential-row + .settings-credential-row { margin-top: 8px; }
        .settings-credential-row .form-label { margin: 0; }
        #settingsPanel .settings-theme-row { margin-top: 12px; }
        .redeem-code-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
        .redeem-code-row label, .redeem-code-row button { flex: 0 0 auto; margin: 0; }
        .redeem-code-row input { min-width: 0; }
        /* 設定面板欄位高度縮小 (38px -> 30px),覆蓋主題樣式 */
        #settingsPanel #savedAccount,
        #settingsPanel #savedPassword,
        #settingsPanel #themeColor,
        #settingsPanel #redeemCodeInput,
        #settingsPanel #redeemCodeButton {
            height: 30px;
            min-height: 30px;
            padding-top: 2px;
            padding-bottom: 2px;
            line-height: 1.2;
        }
        #settingsPanel .account-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        #settingsPanel .account-row label { flex: 0 0 auto; margin: 0; }
        #settingsPanel .account-row .form-control { flex: 1 1 auto; min-width: 0; height: 30px; }
        #settingsPanel .account-mail { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #settingsPanel .account-mail-status { flex: 0 0 auto; font-size: 12px; }
        #settingsPanel .account-danger { margin-top: 8px; color: #ff6b6b; border-color: #ff6b6b; }
        #settingsError { margin-top: 8px; color: #8b1d1d; font-size: 13px; }
        /* web view:角色資料放在設定面板右側 */
        @media (min-width: 769px) {
            #settingsPanel:has(#accountSection:not([hidden])) {
                width: min(920px, calc(100vw - 24px));
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                column-gap: 20px;
                align-content: start;
            }
            #settingsPanel:has(#accountSection:not([hidden])) > * { grid-column: 1; }
            #settingsPanel:has(#accountSection:not([hidden])) > .settings-header { grid-column: 1 / -1; }
            #settingsPanel:has(#accountSection:not([hidden])) > #accountSection {
                grid-column: 2;
                grid-row: 2 / span 8;
                margin-top: 0;
            }
        }
        @media (max-width: 480px) {
            #settingsPanel { width: calc(100vw - 16px); padding-right: 14px; padding-left: 14px; }
            .status-options { gap: 8px 6px; }
            .status-options label { gap: 4px; font-size: 12px; }
        }

        /* ===== 右側面板 (地圖 / 物品 / 裝備) ===== */
        .right-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: var(--right-panel-width);
            box-sizing: border-box;
            height: 100vh;
            background-color: #1a1a1a;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .equipment-panel, .inventory-panel {
            background-color: #2a2a2a;
            padding: 3px;
            border-radius: 5px;
            display: none;
        }
        .equipment-panel.active, .inventory-panel.active { display: block; }
        .equipment-list, .inventory-list {
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.2;
            height: calc(100vh - 520px);
            min-height: 120px;
            overflow-y: auto;
        }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1;
            padding: 1px;
            background-color: #3a3a3a;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.8s;
        }
        .tab-btn:hover { background-color: #4a4a4a; }
        .tab-btn.active { background-color: #5a5a5a; border-bottom: 4px solid #87ceeb; }
        .item-link { cursor: pointer; }
        .item-link:hover { text-decoration: underline; }

        /* right-panel 左側寬度拖移控制 */
        .right-panel-resizer {
            position: fixed;
            top: 0;
            right: var(--right-panel-width);
            width: 10px;
            height: 100vh;
            transform: translateX(50%);
            cursor: col-resize;
            z-index: 1002;
            touch-action: none;
        }
        .right-panel-resizer::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            background: transparent;
            transition: background-color 0.15s;
        }
        .right-panel-resizer:hover::before,
        body.is-resizing-right-panel .right-panel-resizer::before { background: #87ceeb; }
        .right-panel-resizer::after {
            content: "⇔ 按住左鍵拖移調整寬度";
            position: absolute;
            top: 50%;
            right: calc(100% + 6px);
            transform: translateY(-50%);
            padding: 4px 8px;
            white-space: nowrap;
            font-size: 12px;
            color: #fff;
            background: #000c;
            border: 1px solid #87ceeb;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .right-panel-resizer:hover::after { opacity: 1; }
        body.is-resizing-right-panel .right-panel-resizer::after { opacity: 0; }
        body.is-resizing-right-panel { cursor: col-resize; user-select: none; }

        /* ===== 地圖 ===== */
        .map-window {
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
            width: 100%;
            max-height: 420px;
            overflow: hidden;
            color: #eadbb8;
            border: 1px solid #806b43;
            border-radius: 12px;
            background: #17191e;
            box-shadow: 0 16px 60px #000;
        }
        .map-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid #443a29;
            font-size: 1rem;
        }
        .map-toolbar { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
        #mapTitle {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .map-toolbar button, #mapCollapse {
            color: #eadbb8;
            border: 1px solid #645438;
            border-radius: 6px;
            background: #24262b;
            padding: 5px 8px;
            white-space: nowrap;
        }
        .map-toolbar button.active { color: #17191e; background: #d3b36a; }
        #mapCollapse { flex: 0 0 auto; }
        .map-content { min-height: 0; padding: 8px; overflow: auto; }
        .map-window.collapsed .map-content { display: none; }
        #mapSvg {
            display: block;
            width: 100%;
            height: 320px;
            min-width: 0;
            flex: 0 0 320px;
            border: 1px solid #39352c;
            border-radius: 8px;
            background-color: #111318;
            background-image: radial-gradient(#4b4230 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .map-link { stroke: #8d7951; stroke-width: 3; }
        .map-link.vertical { stroke: #7196aa; stroke-dasharray: 8 6; }
        .map-direction-label {
            fill: #d7c18d;
            font: 14px sans-serif;
            paint-order: stroke;
            stroke: #111318;
            stroke-width: 4px;
        }
        .map-room-node { cursor: pointer; }
        .map-room-node rect { fill: #292b30; stroke: #766442; stroke-width: 2; }
        .map-room-node.current rect { fill: #514326; stroke: #e4c36e; stroke-width: 3; }
        .map-room-node.neighbor:hover rect { fill: #3e4a4b; stroke: #a7d1d6; }
        .map-room-node text { fill: #f0e6cf; font: 28px sans-serif; pointer-events: none; }
        .map-room-node .map-vertical-indicators { fill: #8db9c9; font-size: 16px; }

        /* ===== DOT 浮動傷害 ===== */
        #dotFloatLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }
        .dot-float {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 3px #000, 0 0 3px #000;
            animation: dotFloatUp 1s ease-out forwards;
            white-space: nowrap;
        }
        .dot-float img { width: 20px; height: 20px; border-radius: 3px; }
        /* 浮動數值分三欄:玩家 DOT (左) / 玩家 HOT (右) / 目標 DOT。欄位在版面流中,彼此不會重疊 */
        .float-row { position: absolute; display: flex; align-items: flex-end; gap: 8px; }
        /* 玩家區:DOT 靠左、HOT 靠右,寬度至少等於玩家「名稱 (血量%)」的保留寬度 */
        .float-self { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
        .float-lane { display: flex; flex-direction: column; align-items: flex-start; }
        .float-lane.hot { align-items: flex-end; }
        .float-lane .dot-float { position: relative; }
        .dot-float.heal { color: #66ff99; }
        /* DOT 傷害數字一律紅色 (種類由圖示區分) */
        .dot-float.bleed, .dot-float.burn, .dot-float.poison { color: #ff5555; }
        @keyframes dotFloatUp {
            0% { opacity: 0; transform: translateY(0); }
            15%, 70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-45px); }
        }

        /* ===== 九宮格方向按鈕 (只在 mobile 顯示) ===== */
        .mobile-numpad {
            display: none;
            position: fixed;
            top: 8px;
            right: 8px;
            opacity: 0.7;
            z-index: 1001;
        }
        .numpad-row { display: flex; justify-content: flex-end; }
        .numpad-btn {
            width: 48px;
            height: 48px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff3f;
            background: #7660f51f;
            border: none;
            border-radius: 12px;
            outline: none;
            transition: background 0.2s;
        }
        .numpad-btn:active { background: rgba(0,0,0,0.2); }

        /* ===== 響應式 ===== */
        @media (max-width: 1400px) {
            #output-container { margin-right: 0; }
            .right-panel { display: none; }
            .left-panel, #chatArea { flex: 1 1 50%; width: 50%; }
        }
        @media (max-width: 768px) {
            .split-view #output-top { max-height: 0; opacity: 0; border-bottom: 1px solid transparent; }
            body #output-container #output-top { padding-top: 0; padding-bottom: 0; border-width: 0; }
            .mobile-numpad { display: block; }
            .bottom-container { flex-direction: column; }
            .left-panel { order: 1; flex: 0 0 auto; width: 100%; }
            #chatArea {
                order: 2;
                flex: 0 0 auto;
                width: 100%;
                border-left: none;
                border-top: 1px solid #333;
            }
            #targetInfoBar { display: none !important; }
        }
        @media (max-width: 576px) {
            #statusBar { flex-wrap: nowrap !important; overflow-x: auto; }
            .status-hp, .status-mana, .status-move { min-width: 0; flex: 1 1 0; }
            .status-label { display: none !important; }
            .map-header { gap: 5px; padding: 6px; font-size: .9rem; }
            .map-toolbar { gap: 4px; }
            .map-toolbar button, #mapCollapse { padding: 4px 5px; font-size: .8rem; }
        }

        /* ===== 奇幻主題 (theme-dark-fantasy) ===== */
        body.theme-dark-fantasy {
            --df-bg: #111318;
            --df-surface: #181b21;
            --df-panel: #20232b;
            --df-elevated: #292d35;
            --df-border: #49402f;
            --df-border-soft: #332f28;
            --df-text: #e6dfcf;
            --df-secondary: #aaa393;
            --df-muted: #777366;
            --df-gold: #c5a15d;
            --df-gold-highlight: #e0bd79;
            --df-hp: #b94b4b;
            --df-mana: #4778bd;
            --df-move: #b58b43;
            --df-success: #668b65;
            --df-danger: #a94343;
            --df-font-ui: "Segoe UI", "Noto Sans CJK TC", sans-serif;
            --df-font-title: Georgia, "Noto Serif CJK TC", serif;
            --df-font-game: "Noto Sans Mono CJK", "Cascadia Mono", Consolas, monospace;
            background: var(--df-bg);
            color: var(--df-text);
            color-scheme: dark;
            font-family: var(--df-font-ui);
            font-size: 18px;
            overflow: hidden;
        }
        body.theme-dark-fantasy .d-flex.flex-column.h-100 { min-height: 0; }
        body.theme-dark-fantasy #output-container {
            margin-right: var(--right-panel-width);
            padding: 14px 16px 0;
            background: var(--df-bg);
            border-right: 1px solid var(--df-border-soft);
        }
        body.theme-dark-fantasy #output,
        body.theme-dark-fantasy #output-top {
            padding: 18px 22px;
            background: var(--df-surface);
            color: var(--df-text);
            font-family: var(--df-font-game);
            font-size: 16px;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            scrollbar-color: var(--df-border) var(--df-surface);
        }
        body.theme-dark-fantasy #output {
            border: 1px solid var(--df-border-soft);
            border-bottom: 0;
            box-shadow: inset 0 1px 5px #0008;
        }
        body.theme-dark-fantasy #output-top {
            color: var(--df-secondary);
            border: 1px solid var(--df-border-soft);
        }
        body.theme-dark-fantasy .split-view #output-top { border-bottom-color: var(--df-border); }
        body.theme-dark-fantasy .bottom-container {
            gap: 8px;
            padding: 0 0 12px;
            align-items: stretch;
            background: linear-gradient(180deg, transparent, var(--df-bg) 14px);
        }
        body.theme-dark-fantasy .left-panel,
        body.theme-dark-fantasy #chatArea,
        body.theme-dark-fantasy #statusBar,
        body.theme-dark-fantasy #targetInfoBar,
        body.theme-dark-fantasy #inputArea {
            min-width: 0;
            color: var(--df-text);
            /* !important 也一併清掉 diablo 主題的 background-image,維持原本外觀 */
            background: var(--df-panel) !important;

        body.theme-dark-fantasy #targetTargetName,

        body.theme-dark-fantasy .status-move,

        body.theme-dark-fantasy .status-mana .status-icon { color: var(--df-mana); }
        body.theme-dark-fantasy .status-move .status-icon { color: var(--df-move); }
        body.theme-dark-fantasy .status-level .status-icon,
        body.theme-dark-fantasy .status-gold .status-icon { color: var(--df-gold); }
        body.theme-dark-fantasy .status-combat-stat .status-icon { color: var(--df-gold-highlight); }
        body.theme-dark-fantasy .fixed-width {

            font-variant-numeric: tabular-nums;

        body.theme-dark-fantasy .progress {

            background: var(--df-bg);

        }
        body.theme-dark-fantasy .status-hp .progress-bar { background-color: var(--df-hp) !important; }
        body.theme-dark-fantasy .status-mana .progress-bar { background-color: var(--df-mana) !important; }
        body.theme-dark-fantasy .status-move .progress-bar { background-color: var(--df-move) !important; }
        body.theme-dark-fantasy .status-effect {
            padding: 3px 7px;
            color: var(--df-muted);
            background: var(--df-bg);
            border: 1px solid var(--df-border-soft);
            font-size: 13px;
            white-space: nowrap;
        }
        body.theme-dark-fantasy .status-effect.poison.active {
            color: var(--df-success);
            border-color: var(--df-success);
        }
        body.theme-dark-fantasy .status-effect.burn.active,
        body.theme-dark-fantasy .status-effect.bleed.active {
            color: var(--df-hp);
            border-color: var(--df-danger);
        }
        body.theme-dark-fantasy #inputArea { gap: 8px !important; padding: 8px; border-top: 0; }
        body.theme-dark-fantasy #inputBox,
        body.theme-dark-fantasy #themeColor {
            min-height: 38px;
            color: var(--df-text);
            background-color: var(--df-bg);
            border: 1px solid var(--df-border);
            border-radius: 2px;
            font-family: var(--df-font-game);
            font-size: 18px;
            box-shadow: inset 0 1px 4px #0008;
        }
        body.theme-dark-fantasy #inputBox::placeholder { color: var(--df-muted); }
        body.theme-dark-fantasy #inputBox:focus,
        body.theme-dark-fantasy #themeColor:focus {
            border-color: var(--df-gold);
            box-shadow: 0 0 0 2px #c5a15d33, inset 0 1px 4px #0008;
        }
        body.theme-dark-fantasy #themeSelector {
            color: var(--df-text);
            background: var(--df-elevated);
            border-color: var(--df-border);
        }
        body.theme-dark-fantasy .btn,
        body.theme-dark-fantasy .tab-btn,
        body.theme-dark-fantasy .numpad-btn {
            color: var(--df-text);
            background: var(--df-elevated);
            border: 1px solid var(--df-border);
            border-radius: 2px;
            font-family: var(--df-font-ui);
            font-size: 18px;
            transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        body.theme-dark-fantasy #sendButton {
            min-height: 38px;
            color: #17140e;
            background: var(--df-gold);
            border-color: var(--df-gold-highlight);
            font-size: 16px;
            font-weight: 700;
        }
        body.theme-dark-fantasy #sendButton:hover,
        body.theme-dark-fantasy #sendButton:focus-visible { background: var(--df-gold-highlight); }
        body.theme-dark-fantasy .btn:hover,
        body.theme-dark-fantasy .tab-btn:hover,
        body.theme-dark-fantasy .numpad-btn:hover {
            color: var(--df-gold-highlight);
            background: #34332f;
            border-color: var(--df-gold);
        }
        body.theme-dark-fantasy .btn:active,
        body.theme-dark-fantasy .tab-btn:active,
        body.theme-dark-fantasy .numpad-btn:active {
            background: #121419;
            box-shadow: inset 0 2px 5px #0009;
        }
        body.theme-dark-fantasy .btn:disabled,
        body.theme-dark-fantasy .tab-btn:disabled,
        body.theme-dark-fantasy .numpad-btn:disabled {
            color: var(--df-muted);
            background: var(--df-surface);
            border-color: var(--df-border-soft);
            cursor: not-allowed;
        }
        body.theme-dark-fantasy :focus-visible { outline: 2px solid var(--df-gold-highlight); outline-offset: 2px; }
        body.theme-dark-fantasy #chatArea {
            padding: 12px;
            color: var(--df-secondary);
            font-family: var(--df-font-game);
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            scrollbar-color: var(--df-border) var(--df-panel);

        body.theme-dark-fantasy #chatArea p {
            margin: 0 0 8px;
            padding-left: 9px;
            border-left: 2px solid var(--df-border);

        body.theme-dark-fantasy .right-panel {
            display: flex;
            gap: 10px;
            padding: 14px;
            color: var(--df-text);
            background: var(--df-surface);
            border-left: 1px solid var(--df-border);

        body.theme-dark-fantasy .tab-buttons {
            gap: 6px;
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--df-border);
        }
        body.theme-dark-fantasy .tab-btn {
            min-height: 38px;
            color: var(--df-secondary);
            background: var(--df-panel);
            font-family: var(--df-font-title);
            font-size: 16px;
        }
        body.theme-dark-fantasy .tab-btn.active {
            color: var(--df-gold-highlight);
            background: var(--df-elevated);
            border-color: var(--df-gold);
            border-bottom: 2px solid var(--df-gold);
        }
        body.theme-dark-fantasy .equipment-panel,
        body.theme-dark-fantasy .inventory-panel {
            padding: 8px;
            background: var(--df-panel);
            border: 1px solid var(--df-border-soft);
            border-radius: 0;
        }
        body.theme-dark-fantasy .equipment-list,
        body.theme-dark-fantasy .inventory-list {
            height: calc(100vh - 105px);
            padding: 8px;
            color: var(--df-text);
            font-family: var(--df-font-game);
            font-size: 14px;
            line-height: 1.65;
            overflow-wrap: anywhere;
            scrollbar-color: var(--df-border) var(--df-panel);
        }
        body.theme-dark-fantasy .mobile-numpad {
            opacity: 1;
            padding: 5px;
            background: #181b21d9;
            border: 1px solid var(--df-border);
        }
        body.theme-dark-fantasy .numpad-row { gap: 3px; }
        body.theme-dark-fantasy .numpad-btn {
            width: 42px;
            height: 42px;
            color: var(--df-gold-highlight);
            background: #20232bdd;
            font-size: 16px;
        }
        body.theme-dark-fantasy #fleeBtn { color: #f0d7d0; border-color: var(--df-danger); }
        body.theme-dark-fantasy #invbtn { color: var(--df-gold-highlight); }
        body.theme-dark-fantasy ::selection { color: var(--df-bg); background: var(--df-gold); }
        body.theme-dark-fantasy ::-webkit-scrollbar { width: 10px; height: 10px; }
        body.theme-dark-fantasy ::-webkit-scrollbar-track { background: var(--df-bg); }
        body.theme-dark-fantasy ::-webkit-scrollbar-thumb { background: var(--df-border); border: 2px solid var(--df-bg); }
        body.theme-dark-fantasy .right-panel-resizer:hover::before,
        body.theme-dark-fantasy.is-resizing-right-panel .right-panel-resizer::before { background: var(--df-gold); }
        body.theme-dark-fantasy .right-panel-resizer::after { border-color: var(--df-gold); }
        @media (max-width: 1100px) {
            body.theme-dark-fantasy #output-container { margin-right: 0; }
            body.theme-dark-fantasy .right-panel { display: none; }
        }
        @media (max-width: 768px) {
            body.theme-dark-fantasy #output-container { padding: 8px 8px 0; }
            body.theme-dark-fantasy #output,
            body.theme-dark-fantasy #output-top { padding: 12px; font-size: 15px; }
            body.theme-dark-fantasy .bottom-container { gap: 6px; padding: 0 0 8px; }
            body.theme-dark-fantasy #statusBar { gap: 7px 10px !important; padding: 8px; flex-wrap: wrap !important; }
            body.theme-dark-fantasy .status-effects { display: flex !important; flex-wrap: wrap; gap: 4px !important; }
            body.theme-dark-fantasy .status-label { display: inline !important; }
            body.theme-dark-fantasy #inputArea { flex-wrap: wrap; }
            body.theme-dark-fantasy #inputBox { flex: 1 1 45%; }
        }
        @media (max-width: 420px) {
            body.theme-dark-fantasy .status-hp,
            body.theme-dark-fantasy .status-mana,
            body.theme-dark-fantasy .status-move { flex: 1 1 30%; }
        }

        /* ===== 暗黑破壞神主題 (theme-diablo) =====
           疊加在 theme-dark-fantasy 之上: 版面沿用 dark-fantasy,
           這裡只覆寫 --df-* 色票/字型,並加上鐵框、金邊、血紅等裝飾。 */
        body.theme-diablo {
            --df-bg: #0b0807;
            --df-surface: #130e0c;
            --df-panel: #1b1411;
            --df-elevated: #2a1d17;
            --df-border: #5a4426;
            --df-border-soft: #2e2218;
            --df-text: #d6c9ae;
            --df-secondary: #a39880;
            --df-muted: #8d826c;
            --df-gold: #c9a85c;
            --df-gold-highlight: #e6c987;
            --df-hp: #e2574f;
            --df-mana: #5b86e0;
            --df-move: #c28a3a;
            --df-success: #6fae52;
            --df-danger: #a3231b;
            --d2-blood: #7a1712;
            --d2-blood-hot: #a31d15;
            --d2-iron: #3a3027;
            --d2-gold-dim: #8a6d3b;
            --df-font-ui: "Cinzel", "Palatino Linotype", "Book Antiqua", "Noto Serif CJK TC", "PMingLiU", serif;
            --df-font-title: "Cinzel", "Palatino Linotype", "Book Antiqua", "Noto Serif CJK TC", serif;
            background:
                radial-gradient(ellipse at 50% -10%, #3a120c55 0, transparent 55%),
                radial-gradient(ellipse at 50% 120%, #00000099 0, transparent 60%),
                var(--df-bg);
        }
        body.theme-diablo .left-panel,
        body.theme-diablo #chatArea,
        body.theme-diablo #statusBar,
        body.theme-diablo #targetInfoBar,
        body.theme-diablo #inputArea,
        body.theme-diablo .equipment-panel,
        body.theme-diablo .inventory-panel {
            border-color: var(--d2-iron);
            background-image: linear-gradient(180deg, #ffffff06, transparent 30%, #00000040);
            box-shadow:
                inset 0 0 0 1px #00000099,
                inset 0 0 0 2px #8a6d3b33,
                inset 0 8px 18px #00000066,
                0 4px 14px #000a;
        }
        body.theme-diablo #output,
        body.theme-diablo #output-top {
            background:
                radial-gradient(ellipse at 50% 0, #2a110b33, transparent 70%),
                var(--df-surface);
            border-color: var(--d2-iron);
            box-shadow: inset 0 0 0 1px #000, inset 0 0 22px #000b;
        }
        body.theme-diablo .right-panel {
            border-left: 2px solid var(--d2-iron);
            box-shadow: -1px 0 0 #000, -9px 0 24px #000a, inset 1px 0 0 #8a6d3b44;
        }
        body.theme-diablo #inputBox,
        body.theme-diablo #themeColor {
            border: 1px solid var(--d2-gold-dim);
            background-color: #070504;
            box-shadow: inset 0 2px 7px #000;
        }
        body.theme-diablo #inputBox:focus,
        body.theme-diablo #themeColor:focus {
            border-color: var(--df-gold-highlight);
            box-shadow: 0 0 0 2px #c9a85c40, 0 0 12px #c9a85c33, inset 0 2px 7px #000;
        }
        body.theme-diablo .btn,
        body.theme-diablo .tab-btn,
        body.theme-diablo .numpad-btn,
        body.theme-diablo #themeSelector,
        body.theme-diablo .map-toolbar button,
        body.theme-diablo #mapCollapse,
        body.theme-diablo .settings-window-control,
        body.theme-diablo .settings-reset-button {
            color: var(--df-gold);
            background: linear-gradient(180deg, #33261e, #1a120e);
            border-color: var(--d2-gold-dim);
        }
        body.theme-diablo .btn,
        body.theme-diablo .tab-btn,
        body.theme-diablo .numpad-btn,
        body.theme-diablo #themeSelector {
            border: 1px solid var(--d2-gold-dim);
            box-shadow: inset 0 1px 0 #ffffff10, inset 0 -2px 4px #0008;
            text-shadow: 0 1px 2px #000;
        }
        body.theme-diablo .settings-window-control,
        body.theme-diablo .settings-reset-button { box-shadow: inset 0 1px 0 #ffffff10; }
        body.theme-diablo .btn:hover,
        body.theme-diablo .tab-btn:hover,
        body.theme-diablo .numpad-btn:hover,
        body.theme-diablo #themeSelector:hover,
        body.theme-diablo .settings-window-control:hover,
        body.theme-diablo .settings-reset-button:hover,
        body.theme-diablo .map-toolbar button.active {
            color: #fff1d0;
            background: linear-gradient(180deg, var(--d2-blood-hot), var(--d2-blood));
        }
        body.theme-diablo .btn:hover,
        body.theme-diablo .tab-btn:hover,
        body.theme-diablo .numpad-btn:hover,
        body.theme-diablo #themeSelector:hover { border-color: var(--df-gold-highlight); }
        body.theme-diablo .map-toolbar button.active { border-color: var(--df-gold); }
        body.theme-diablo .btn:active,
        body.theme-diablo .tab-btn:active,
        body.theme-diablo .numpad-btn:active {
            background: linear-gradient(180deg, #4a0d09, #240504);
            box-shadow: inset 0 3px 8px #000;
        }
        body.theme-diablo #sendButton {
            color: #f3e3c3;
            background: linear-gradient(180deg, var(--d2-blood-hot), #5c0f0b);
            border: 1px solid var(--df-gold);
            text-shadow: 0 1px 2px #000;
            letter-spacing: 0.08em;
        }
        body.theme-diablo #sendButton:hover,
        body.theme-diablo #sendButton:focus-visible {
            color: #fff1d0;
            background: linear-gradient(180deg, #c42319, #7a1712);
            box-shadow: 0 0 12px #a31d1566, inset 0 1px 0 #ffffff22;
        }
        body.theme-diablo .tab-btn.active {
            color: var(--df-gold-highlight);
            background: linear-gradient(180deg, #4a1a12, #230b08);
            border-color: var(--df-gold);
            border-bottom: 2px solid var(--d2-blood-hot);
        }
        body.theme-diablo #fleeBtn { color: #f2c9c2; border-color: var(--d2-blood-hot); }
        body.theme-diablo .progress {
            height: 7px;
            background: #050302;
            border: 1px solid #000;
            box-shadow: 0 0 0 1px var(--d2-iron), inset 0 1px 3px #000;
        }
        body.theme-diablo .status-hp .progress-bar {
            background-image: linear-gradient(180deg, #e0463d, #8c150f) !important;
            background-color: #b8201c !important;
            box-shadow: 0 0 6px #b8201c88;
        }
        body.theme-diablo .status-mana .progress-bar {
            background-image: linear-gradient(180deg, #5b86e0, #1f3f93) !important;
            background-color: #2c58c4 !important;
            box-shadow: 0 0 6px #2c58c488;
        }
        body.theme-diablo .status-move .progress-bar {
            background-image: linear-gradient(180deg, #d9a042, #7d5316) !important;
            background-color: #a8742a !important;
        }
        body.theme-diablo .status-effect { background: #070504; border-color: var(--d2-iron); }
        body.theme-diablo .tab-btn,
        body.theme-diablo .settings-header h2,
        body.theme-diablo #mapTitle {
            font-family: var(--df-font-title);
            letter-spacing: 0.06em;
            text-shadow: 0 1px 3px #000;
        }
        body.theme-diablo #targetName,
        body.theme-diablo #targetHp { text-shadow: 0 0 8px #a31d1566; }
        body.theme-diablo ::selection { color: #fff1d0; background: var(--d2-blood-hot); }
        body.theme-diablo ::-webkit-scrollbar-track { background: #070504; }
        body.theme-diablo ::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #3a3027, #5a4426);
            border: 2px solid #070504;
        }
        body.theme-diablo #output,
        body.theme-diablo #output-top,
        body.theme-diablo #chatArea,
        body.theme-diablo .equipment-list,
        body.theme-diablo .inventory-list { scrollbar-color: #5a4426 #070504; }
        body.theme-diablo .mobile-numpad { background: #0b0807e6; border-color: var(--d2-gold-dim); }
        /* 設定面板: 預設是羊皮紙卷軸,D2 主題改成黑鐵皮革 + 金邊 */
        body.theme-diablo #settingsPanel {
            color: var(--df-text);
            background:
                radial-gradient(ellipse at 50% 0, #3a120c66, transparent 70%),
                repeating-linear-gradient(3deg, #1b1411 0, #211814 2px, #1b1411 5px);
            border: 1px solid var(--d2-gold-dim);
            box-shadow: 0 14px 38px #000, inset 0 0 0 1px #000, inset 0 0 0 2px #8a6d3b44, inset 0 0 40px #000a;
            font-family: var(--df-font-title);
        }
        body.theme-diablo #settingsPanel::before,
        body.theme-diablo #settingsPanel::after {
            background: linear-gradient(180deg, #2a1f18, var(--d2-gold-dim) 45%, #2a1f18);
            box-shadow: 0 2px 4px #000a;
        }
        body.theme-diablo #settingsPanel h2 { color: var(--df-gold-highlight); }
        body.theme-diablo #settingsPanel label,
        body.theme-diablo #settingsPanel legend { color: var(--df-gold); }
        body.theme-diablo #settingsPanel .form-control,
        body.theme-diablo #settingsPanel .form-select,
        body.theme-diablo #settingsPanel #savedAccount,
        body.theme-diablo #settingsPanel #savedPassword,
        body.theme-diablo #settingsPanel #redeemCodeInput {
            color: var(--df-text);
            border-color: var(--d2-gold-dim);
            background-color: #070504;
        }
        body.theme-diablo #settingsPanel fieldset { border-color: var(--d2-iron); background: #00000033; }
        body.theme-diablo #settingsPanel .form-check-input { border-color: var(--d2-gold-dim); background-color: #070504; }
        body.theme-diablo #settingsPanel .form-check-input:checked {
            background-color: var(--d2-blood-hot);
            border-color: var(--df-gold);
        }
    </style>
</head>
<body class="container-fluid p-0">
    <div class="d-flex flex-column h-100">
        <div id="output-container">
            <div id="output-top" class="formatted-text"></div>
            <div id="output" class="formatted-text"></div>
            <div id="dotFloatLayer">
                <div id="floatRow" class="float-row">
                    <div id="selfFloats" class="float-self">
                        <div id="selfDotLane" class="float-lane"></div>
                        <div id="selfHotLane" class="float-lane hot"></div>
                    </div>
                    <div id="targetDotLane" class="float-lane"></div>
                </div>
            </div>
        </div>
        <!-- 九宮格方向按鈕 (只在 mobile 顯示) -->
        <div class="mobile-numpad">
            <div class="numpad-row">
                <button class="numpad-btn" id="fleeBtn" data-cmd="flee">逃</button>
                <button class="numpad-btn" data-cmd="north">N</button>
                <button class="numpad-btn" data-cmd="up">U</button>
            </div>
            <div class="numpad-row">
                <button class="numpad-btn" data-cmd="west">W</button>
                <button class="numpad-btn" data-cmd="look">L</button>
                <button class="numpad-btn" data-cmd="east">E</button>
            </div>
            <div class="numpad-row">
                <button class="numpad-btn" id="invbtn" data-cmd="inv">道</button>
                <button class="numpad-btn" data-cmd="south">S</button>
                <button class="numpad-btn" data-cmd="down">D</button>
            </div>
        </div>
        <div class="bottom-container">
            <div class="left-panel">
                <!-- 目標資訊列:左側為玩家自己,右側為目標 -->
                <div id="targetInfoBar" class="d-flex flex-row align-items-center">
                    <span id="targetTargetName"></span>
                    <span id="targetTargetHp"></span>
                    <span class="target-arrow-icon ms-1 me-2"><i class="fas fa-angle-double-left"></i></span>
                    <span id="targetName"></span>
                    <span id="targetHp"></span>
                </div>
                <div id="statusBar" class="d-flex flex-wrap align-items-center gap-3">
                    <div class="status-hp" data-status-key="hp">
                        <span class="status-label"><i class="fas fa-heart status-icon"></i>生命:</span><span id="currentHp" class="fixed-width bar-width">0</span>/<span id="maxHp" class="fixed-width bar-width">0</span>
                        <div class="progress"><div class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div></div>
                    </div>
                    <div class="status-mana" data-status-key="mana">

    <script>
        const $ = id => document.getElementById(id);

        // 優先順序: ?server=ws://host:port  >  本機(localhost/127.0.0.1/file://) 用開發機  >  正式機
        const SERVER_URL = (() => {
            const override = new URLSearchParams(location.search).get('server');
            if (override && /^wss?:\/\/[\w.\-]+(:\d+)?$/.test(override)) return override;
            const host = location.hostname;
            const isLocal = location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1';
            return isLocal ? 'ws://localhost:9999' : 'wss://wssmo.myctw.cc:443';
        })();
        const outputContainer = $('output-container');
        const outputTop = $('output-top');
        const outputDiv = $('output');
        const inputBox = $('inputBox');
        const chatArea = $('chatArea');
        const MAX_CHAT_LINES = 7;
        const MAX_OUTPUT_LINES = 200;
        const MAX_COMMAND_HISTORY = 10;
        const IDLE_LOGOUT_MS = 300000;
        const RECONNECT_MS = 10000;
        const MOBILE_QUERY = '(max-width: 768px)';

        let ws;
        let inputMode = null;
        let autoLoginStage = 'account';
        let isPasswordInput = false;
        let inactivityTimer;
        let reconnectTimer = null;
        const commandHistory = [];
        let currentHistoryIndex = -1;

        const isMobileLayout = () => window.matchMedia(MOBILE_QUERY).matches;
        // 回傳給 server 的顯示模式,依視窗寬度判斷 (與 mobile layout 斷點一致)
        const getClientView = () => isMobileLayout() ? 'mobile' : 'web';
        const isOpen = () => ws && ws.readyState === WebSocket.OPEN;
        const scrollOutputToBottom = () => { outputDiv.scrollTop = outputDiv.scrollHeight; };

        // 讓元素可用滑鼠點擊或 Enter / 空白鍵觸發
        function makeActivatable(element, label, action) {
            element.setAttribute('role', 'button');
            element.setAttribute('tabindex', '0');
            element.setAttribute('aria-label', label);
            element.addEventListener('click', action);
            element.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    action();
                }
            });
        }

        // ---- 連線診斷:回報給 server 的 db/log/conn_diag 日誌 ----
        const DIAG_PING_MS = 30000;
        const diag = {
            sessionId: Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
            events: [], socket: null, openedAt: 0, lastServerMsgAt: 0,
            rtt: { min: null, max: null, sum: 0, n: 0, last: null },
            seq: 0, sent: {}, timer: null, hiddenSince: null, hiddenTotalMs: 0
        };
        const storageGet = key => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } };
        const storageSet = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ } };

        function diagNetInfo() {
            const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            return c ? { et: c.effectiveType, dl: c.downlink, nrtt: c.rtt, nt: c.type, sd: c.saveData } : null;
        }

        function diagEvent(type, x) {
            diag.events.push({
                t: Date.now(), type, vis: document.visibilityState, online: navigator.onLine,
                x: x === undefined ? undefined : String(x).slice(0, 60)
            });
            if (diag.events.length > 40) diag.events.shift();
        }

        function diagSaveReport(event, source) {
            const now = Date.now();
            const r = diag.rtt;
            storageSet('marsDiagReport', {
                closeSource: source || (diag.socket && diag.socket.__closeSource) || 'remote_or_network',
                code: event ? event.code : null,
                reason: event ? event.reason : null,
                wasClean: event ? event.wasClean : null,
                closedAt: now,
                connDurationMs: diag.openedAt ? now - diag.openedAt : null,
                lastServerMsgAgoMs: diag.lastServerMsgAt ? now - diag.lastServerMsgAt : null,
                vis: document.visibilityState,
                online: navigator.onLine,
                net: diagNetInfo(),
                hiddenTotalMs: diag.hiddenTotalMs + (diag.hiddenSince ? now - diag.hiddenSince : 0),
                rtt: r.n ? { min: r.min, max: r.max, avg: Math.round(r.sum / r.n), n: r.n, last: r.last } : null,
                pendingPings: Object.keys(diag.sent).length,
                events: diag.events.slice(-30)
            });
        }

        function diagSendPing(socket, drift) {
            if (socket !== ws || !isOpen()) return;
            const id = ++diag.seq;
            const now = Date.now();
            diag.sent[id] = now;
            const keys = Object.keys(diag.sent);
            if (keys.length > 10) delete diag.sent[keys[0]];
            const r = diag.rtt;
            socket.send(JSON.stringify({
                type: 'ping', id, t: now, drift,
                vis: document.visibilityState, online: navigator.onLine,
                ...diagNetInfo(),
                lost: Object.keys(diag.sent).length - 1,
                rtt: r.last, rttMin: r.min, rttMax: r.max,
                rttAvg: r.n ? Math.round(r.sum / r.n) : null, rttN: r.n
            }));
            storageSet('marsDiagAlive', { t: now, vis: document.visibilityState });
        }

        function diagOnOpen(socket) {
            const now = Date.now();
            Object.assign(diag, {
                socket, openedAt: now, lastServerMsgAt: now, sent: {}, hiddenTotalMs: 0,
                rtt: { min: null, max: null, sum: 0, n: 0, last: null },
                hiddenSince: document.visibilityState === 'hidden' ? now : null
            });
            diagEvent('open');

            let report = storageGet('marsDiagReport');
            const alive = storageGet('marsDiagAlive');
            if (report && alive) {
                report.prevLastAliveAt = alive.t;
                report.prevLastAliveVis = alive.vis;
            } else if (alive) {
                // 上一個頁面沒有留下任何關閉紀錄 (瀏覽器直接殺掉分頁 / 當機)
                report = { closeSource: 'previous_page_killed_no_event', closedAt: alive.t,
                    prevLastAliveAt: alive.t, prevLastAliveVis: alive.vis, events: [] };
            }
            const { et, dl, nrtt, nt } = diagNetInfo() || {};
            try {
                socket.send(JSON.stringify({
                    type: 'clientDiag', sessionId: diag.sessionId, view: getClientView(), report,
                    current: { vis: document.visibilityState, online: navigator.onLine, et, dl, nrtt, nt }
                }));
                localStorage.removeItem('marsDiagReport');
            } catch (e) { /* ignore */ }

            clearInterval(diag.timer);
            let expected = now + DIAG_PING_MS;
            diag.timer = setInterval(() => {
                const t = Date.now();
                const drift = Math.max(0, t - expected); // 背景分頁被節流時會變很大
                expected = t + DIAG_PING_MS;
                diagSendPing(socket, drift);
            }, DIAG_PING_MS);
            setTimeout(() => diagSendPing(socket, 0), 3000); // 先快速量一次 RTT
        }

        function diagOnPong(data) {
            let obj;
            try { obj = JSON.parse(data); } catch (e) { return; }
            if (!obj || typeof obj.t !== 'number') return;
            const rtt = Date.now() - obj.t;
            const r = diag.rtt;
            r.last = rtt; r.n++; r.sum += rtt;
            if (r.min === null || rtt < r.min) r.min = rtt;
            if (r.max === null || rtt > r.max) r.max = rtt;
            delete diag.sent[obj.id];
        }

        document.addEventListener('visibilitychange', () => {
            const now = Date.now();
            if (document.visibilityState === 'hidden') diag.hiddenSince = now;
            else if (diag.hiddenSince) { diag.hiddenTotalMs += now - diag.hiddenSince; diag.hiddenSince = null; }
            diagEvent('visibility', document.visibilityState);
        });
        window.addEventListener('online', () => diagEvent('online'));
        window.addEventListener('offline', () => diagEvent('offline'));
        window.addEventListener('pageshow', e => diagEvent('pageshow', e.persisted ? 'bfcache' : ''));
        window.addEventListener('pagehide', e => {
            diagEvent('pagehide', e.persisted ? 'bfcache' : '');
            diagSaveReport(null, 'page_unload');
        });
        document.addEventListener('freeze', () => diagEvent('freeze'));
        document.addEventListener('resume', () => diagEvent('resume'));
        navigator.connection?.addEventListener?.('change', () => {
            const i = diagNetInfo();
            diagEvent('netchange', i ? i.et + '/' + i.dl + '/' + i.nrtt : '');
        });

        // ===== 地圖 =====
        const mapState = { data: null, view: 'nearby' };
        const NEARBY_MAP_VIEW_BOX = '50 40 900 520';
        const VERTICAL_DIRECTIONS = ['up', 'down'];
        const mapDirectionNames = { north: '北', east: '東', south: '南', west: '西', up: '上', down: '下' };
        const mapDirectionOffsets = {
            north: { x: 0, y: -1 }, east: { x: 1, y: 0 }, south: { x: 0, y: 1 },
            west: { x: -1, y: 0 }, up: { x: 1, y: -1 }, down: { x: -1, y: 1 }
        };
        const mapSvg = $('mapSvg');

        function svgElement(name, attributes = {}) {
            const element = document.createElementNS('http://www.w3.org/2000/svg', name);
            for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
            return element;
        }

        function addMapNode(room, { x, y }, isCurrent, direction) {
            const width = 156;
            const height = 64;
            const group = svgElement('g', {
                class: `map-room-node${isCurrent ? ' current' : ''}${direction ? ' neighbor' : ''}`,
                transform: `translate(${x - width / 2}, ${y - height / 2})`
            });
            const title = svgElement('text', {
                x: width / 2, y: height / 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle'
            });
            title.textContent = Array.from(room.name || `房間 ${room.id}`).slice(0, 5).join('');
            group.append(svgElement('rect', { x: 0, y: 0, width, height, rx: 12 }), title);
            VERTICAL_DIRECTIONS.forEach((vertical, index) => {
                if (!room.connections?.[vertical]) return;
                const indicator = svgElement('text', {
                    class: 'map-vertical-indicators',
                    x: width / 2 + (index === 0 ? -12 : 12),
                    y: 61,
                    'text-anchor': 'middle'
                });
                indicator.textContent = vertical === 'up' ? '↑' : '↓';
                // 只有目前房間的上下樓可以點擊移動
                if (isCurrent) makeActivatable(indicator, `${mapDirectionNames[vertical]}：移動`, () => sendMessage(vertical));
                group.append(indicator);
            });
            if (direction) {
                makeActivatable(group, `${mapDirectionNames[direction]}：${room.name}，按下移動`, () => sendMessage(direction));
            }
            mapSvg.append(group);
        }

        function addMapLink(from, to, direction, vertical) {
            const line = svgElement('line', {
                class: `map-link${vertical ? ' vertical' : ''}`,
                x1: from.x, y1: from.y, x2: to.x, y2: to.y
            });
            const label = svgElement('text', {
                class: 'map-direction-label',
                x: (from.x + to.x) / 2,
                y: (from.y + to.y) / 2 - 8,
                'text-anchor': 'middle'
            });
            label.textContent = mapDirectionNames[direction] || direction;
            mapSvg.append(line, label);
        }

        // 畫出房間與連線;pointFor(room) 回傳房間座標;markVertical 時上下樓連線用虛線
        function drawMapRooms(rooms, currentRoom, pointFor, markVertical) {
            const roomById = new Map(rooms.map(room => [String(room.id), room]));
            const drawnLinks = new Set();
            for (const room of rooms) {
                for (const [direction, target] of Object.entries(room.connections || {})) {
                    const targetRoom = roomById.get(String(target.id));
                    if (!targetRoom) continue;
                    const key = [String(room.id), String(target.id)].sort().join(':');
                    if (drawnLinks.has(key)) continue;
                    drawnLinks.add(key);
                    addMapLink(pointFor(room), pointFor(targetRoom), direction,
                        markVertical && VERTICAL_DIRECTIONS.includes(direction));
                }
            }
            const exitByRoomId = new Map(
                Object.entries(currentRoom.connections || {}).reverse().map(([direction, target]) => [String(target.id), direction])
            );
            for (const room of rooms) {
                addMapNode(room, pointFor(room), String(room.id) === String(currentRoom.id), exitByRoomId.get(String(room.id)));
            }
        }

        // 區域全圖:從目前房間開始依出口方向 BFS 排版,位置衝突時往外找空位
        function getAreaMapPositions(rooms, currentRoomId) {
            const roomById = new Map(rooms.map(room => [String(room.id), room]));
            const positions = new Map();
            const occupied = new Set();
            const pending = [];

            function place(id, desired) {
                let { x, y } = desired;
                for (let radius = 1; occupied.has(`${x},${y}`); radius++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const dy = radius - Math.abs(dx);
                        const free = (dy === 0 ? [[dx, 0]] : [[dx, dy], [dx, -dy]])
                            .find(([ox, oy]) => !occupied.has(`${desired.x + ox},${desired.y + oy}`));
                        if (free) {
                            [x, y] = [desired.x + free[0], desired.y + free[1]];
                            break;
                        }
                    }
                }
                occupied.add(`${x},${y}`);
                positions.set(String(id), { x, y });
                pending.push(String(id));
            }

            function visitReachableRooms() {
                while (pending.length > 0) {
                    const id = pending.shift();
                    const position = positions.get(id);
                    for (const [direction, target] of Object.entries(roomById.get(id).connections || {})) {
                        const targetId = String(target.id);
                        const offset = mapDirectionOffsets[direction];
                        if (!offset || !roomById.has(targetId) || positions.has(targetId)) continue;
                        place(targetId, { x: position.x + offset.x, y: position.y + offset.y });
                    }
                }
            }

            if (roomById.has(String(currentRoomId))) place(currentRoomId, { x: 0, y: 0 });
            visitReachableRooms();
            rooms.forEach((room, index) => {
                if (positions.has(String(room.id))) return;
                place(room.id, { x: index * 2, y: 0 });
                visitReachableRooms();
            });
            return positions;
        }

        function renderMap() {
            const data = mapState.data;
            const currentRoom = data?.currentRoom;
            $('mapTitle').textContent = data ? data.areaName : '地圖';
            mapSvg.replaceChildren();
            mapSvg.hidden = !currentRoom;
            if (!currentRoom) return;

            document.querySelector('[data-map-view="area"]').hidden = !data.canViewAreaMap;
            if (!data.canViewAreaMap) mapState.view = 'nearby';
            document.querySelectorAll('[data-map-view]').forEach(button => {
                button.classList.toggle('active', button.dataset.mapView === mapState.view);
            });

            if (mapState.view === 'nearby') {
                drawMapRooms(data.rooms, currentRoom, room => ({ x: 500 + room.x * 175, y: 300 + room.y * 100 }), false);
                mapSvg.setAttribute('viewBox', NEARBY_MAP_VIEW_BOX);
                return;
            }

            const rooms = data.areaRooms || [];
            const positions = getAreaMapPositions(rooms, currentRoom.id);
            const all = [...positions.values()];
            const minX = Math.min(...all.map(p => p.x));
            const minY = Math.min(...all.map(p => p.y));
            drawMapRooms(rooms, currentRoom, room => {

                return { x: 130 + (p.x - minX) * 190, y: 130 + (p.y - minY) * 120 };
            }, true);

            if (!bounds.width || !bounds.height) {

                return;

        // 密碼以 AES-GCM 加密後存在 localStorage,金鑰 (不可匯出) 存在 IndexedDB
        function idbRequest(request) {
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getCredentialKey(createIfMissing) {
            const openRequest = indexedDB.open('marsII-settings', 1);
            openRequest.onupgradeneeded = () => openRequest.result.createObjectStore('keys');
            const database = await idbRequest(openRequest);
            try {
                const existingKey = await idbRequest(database.transaction('keys', 'readonly').objectStore('keys').get('credentials'));
                if (existingKey || !createIfMissing) return existingKey;
                const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
                await new Promise((resolve, reject) => {
                    const transaction = database.transaction('keys', 'readwrite');
                    transaction.objectStore('keys').put(key, 'credentials');
                    transaction.oncomplete = resolve;
                    transaction.onerror = transaction.onabort = () => reject(transaction.error);
                });
                return key;
            } finally {
                database.close();
            }
        }

        const bytesToBase64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
        const base64ToBytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));

        async function encryptPassword(password) {
            if (!password) return null;
            if (!window.crypto?.subtle || !window.indexedDB) {
                throw new Error('此瀏覽器不支援安全的密碼儲存，密碼未被保存。');
            }
            const key = await getCredentialKey(true);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(password));
            return { iv: bytesToBase64(iv), ciphertext: bytesToBase64(ciphertext) };
        }

        async function decryptPassword(encryptedPassword) {
            if (!window.crypto?.subtle || !window.indexedDB) {
                throw new Error('此瀏覽器不支援解密已儲存的密碼。');
            }
            const key = await getCredentialKey(false);
            if (!key) throw new Error('找不到密碼解密金鑰，請重新輸入密碼。');
            const plaintext = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: base64ToBytes(encryptedPassword.iv) },
                key,
                base64ToBytes(encryptedPassword.ciphertext)
            );
            return new TextDecoder().decode(plaintext);
        }

                        dotAnim: ANIM_SETTINGS.dotAnim.checked,
                        hotAnim: ANIM_SETTINGS.hotAnim.checked,
                        status: { ...currentSettings.status },
                        theme: themeSelect.value
                    };
                    localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
                    currentSettings.account = settings.account;
                    currentSettings.notifyChat = settings.notifyChat;
                    encryptedSavedPassword = encryptedPassword;
                    showSettingsError('');
                    applyTheme(settings.theme);
                    if (!shouldSavePassword) return;
                    if (passwordInput.value === passwordToSave) {

                        passwordChanged = false;
